<script data-bundle>
// config.js 의 내용을 읽어 화면을 그립니다. 내용 수정은 config.js 에서 하세요.
(function () {
  // 관리자 화면에서 '미리보기 적용'한 설정이 있으면 이 브라우저에서만 그것을 사용
  window.ORIGINAL_CONFIG = window.SITE_CONFIG;
  try {
    const draft = localStorage.getItem("siteConfig.draft");
    if (draft) { window.SITE_CONFIG = JSON.parse(draft); window.CONFIG_IS_DRAFT = true; }
  } catch { /* 저장소를 쓸 수 없으면 원본 사용 */ }
  const C = window.SITE_CONFIG;
  const $ = (sel) => document.querySelector(sel);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  const sectionHead = (title, lead) =>
    `<h2 class="section-title">${esc(title)}</h2>` +
    (lead ? `<p class="section-lead">${esc(lead)}</p>` : "");

  const iconCard = (c, body) => `
    <article class="card">
      <div class="card-icon">${esc(c.icon)}</div>
      <h3>${esc(c.title)}</h3>${body}
    </article>`;

  /* ---------- 헤더 ---------- */
  document.title = C.site.title;
  $("#logo").textContent = C.site.logoText;
  $("#siteNav").innerHTML = C.nav
    .map((n) => `<a href="#${esc(n.id)}" data-id="${esc(n.id)}"${n.cta ? ' class="cta"' : ""}>${esc(n.label)}</a>`).join("");

  /* ---------- 첫 화면 + 한눈에 보기 ---------- */
  const h = C.hero;
  const isExternal = (href) => /^https?:/.test(href);
  const hero = `
    <section class="hero" id="hero">
      ${h.logo ? `<img class="hero-logo" src="${esc(h.logo)}" alt="${esc(h.logoAlt || "")}">` : ""}
      <span class="hero-badge">${esc(h.badge)}</span>
      <h1>${esc(h.title)}</h1>
      <p class="hero-subtitle">${esc(h.subtitle)}</p>
      <p class="desc">${esc(h.description)}</p>
      <div class="btns">${h.buttons.map((b) =>
        `<a class="btn${b.primary ? " primary" : ""}" href="${esc(b.href)}"${
          isExternal(b.href) ? ' target="_blank" rel="noopener"' : ""}>${esc(b.label)}</a>`).join("")}</div>
    </section>
    <div class="info-bar card">${C.info.map((i) => `
      <div class="info-item">
        <span class="info-icon">${esc(i.icon)}</span>
        <div><span class="info-label">${esc(i.label)}</span><strong>${esc(i.value)}</strong></div>
      </div>`).join("")}</div>`;

  /* ---------- 숫자 강조 카드 ---------- */
  const stats = `
    <div class="stats">${C.stats.map((s) => `
      <article class="card stat">
        <div class="stat-num"><span data-count="${Number(s.value) || 0}">${esc(s.value)}</span><small>${esc(s.suffix)}</small></div>
        <p>${esc(s.label)}</p>
      </article>`).join("")}</div>`;

  /* ---------- 프로그램 소개 (장점 슬라이드) ---------- */
  const about = `
    <section id="about">
      ${sectionHead(C.about.title, C.about.lead)}
      <div class="slider" aria-roledescription="carousel">
        <button class="slider-btn prev" aria-label="이전 슬라이드">‹</button>
        <div class="slider-track" tabindex="0">${C.about.slides.map((c, i) => `
          <div class="slide" aria-label="${i + 1} / ${C.about.slides.length}">
            ${iconCard(c, `<p>${esc(c.text)}</p>`)}
          </div>`).join("")}</div>
        <button class="slider-btn next" aria-label="다음 슬라이드">›</button>
      </div>
      <div class="slider-dots">${C.about.slides.map((_, i) =>
        `<button aria-label="${i + 1}번 슬라이드로 이동"></button>`).join("")}</div>
    </section>`;

  /* ---------- 날짜 계산: 주차별 수업일 자동 생성 ---------- */
  const S = C.schedule;
  const DOW = "일월화수목금토";
  const pad = (n) => String(n).padStart(2, "0");
  const parseDate = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const parseDateTime = (s) => {
    const [d, t = "23:59"] = s.trim().split(/[ T]/);
    const dt = parseDate(d), [hh, mm] = t.split(":").map(Number);
    dt.setHours(hh, mm);
    return dt;
  };
  const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const md = (d) => `${d.getMonth() + 1}/${d.getDate()}(${DOW[d.getDay()]})`;
  const fullDate = (d) => `${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일 (${DOW[d.getDay()]})`;
  const fmtDue = (d) => `${md(d)} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  const timeRange = `${S.startTime} – ${S.endTime}`;

  const startDate = parseDate(S.startDate);
  const firstMonday = new Date(startDate);
  firstMonday.setDate(firstMonday.getDate() - ((firstMonday.getDay() + 6) % 7));
  const holidays = Object.fromEntries(S.holidays.map((h) => [h.date, h.name]));
  const sessionsByDate = {}, dueByDate = {};

  const weeks = C.curriculum.weeks.map((w, i) => {
    const week = { ...w, no: i + 1, place: w.place || S.place, sessions: [],
      assignments: [].concat(w.assignment || []).map((a) => ({ ...a, dueDate: parseDateTime(a.due) })) };
    let topicIdx = 0;
    [...S.days].sort((a, b) => ((a + 6) % 7) - ((b + 6) % 7)).forEach((dow) => {
      const d = new Date(firstMonday);
      d.setDate(d.getDate() + i * 7 + ((dow + 6) % 7));
      if (d < startDate) return;
      const key = ymd(d), holiday = holidays[key] || null;
      const s = { date: d, key, week, holiday, topic: holiday ? null : (w.topics || [])[topicIdx++] || "" };
      week.sessions.push(s);
      sessionsByDate[key] = s;
    });
    week.assignments.forEach((a) => {
      (dueByDate[ymd(a.dueDate)] ||= []).push({ ...a, week });
    });
    return week;
  });

  const todayKey = ymd(new Date());
  const isThisWeek = (w) => w.sessions.length &&
    (() => { const mon = new Date(firstMonday); mon.setDate(mon.getDate() + (w.no - 1) * 7);
      const next = new Date(mon); next.setDate(next.getDate() + 7);
      const now = new Date(); return now >= mon && now < next; })();

  const sessionLine = (s) => s.holiday
    ? `<li class="off"><b>${md(s.date)}</b> 휴강 · ${esc(s.holiday)}</li>`
    : `<li><b>${md(s.date)}</b> ${timeRange}${s.topic ? ` · ${esc(s.topic)}` : ""}</li>`;

  const videoLinks = (videos) => videos && videos.length ? `
    <h4>🎬 참고 영상</h4>
    <ul class="video-list">${videos.map((v) =>
      `<li><a href="${esc(v.url)}" target="_blank" rel="noopener">▶ ${esc(v.title)}</a></li>`).join("")}</ul>` : "";

  const assignmentBox = (a) => `
    <div class="assignment">
      <div class="assignment-head">
        <span class="assignment-label">📌 과제</span>
        <strong>${esc(a.title)}</strong>
      </div>
      <p>${esc(a.desc)}</p>
      <div class="assignment-foot">
        <div>
          <span class="due">마감 ${fmtDue(a.dueDate)}</span>
          <span class="countdown" data-due="${a.dueDate.getTime()}"></span>
        </div>
        <a class="btn primary submit-btn" href="${esc(a.submitUrl || "#")}" target="_blank" rel="noopener"
           data-due="${a.dueDate.getTime()}">제출하기</a>
      </div>
    </div>`;

  const weekDetail = (w) => `
    <div class="week-meta">
      <div><span>📅 날짜·시간</span><ul>${w.sessions.map(sessionLine).join("")}</ul></div>
      <div><span>📍 수업 장소</span><p>${esc(w.place)}</p></div>
    </div>
    <h4>📖 학습 내용</h4>
    <ul class="content-list">${(w.contents || []).map((c) => `<li>${esc(c)}</li>`).join("")}</ul>
    ${videoLinks(w.videos)}
    ${w.assignments.map(assignmentBox).join("")}`;

  const curriculum = `
    <section id="curriculum">
      ${sectionHead(C.curriculum.title, C.curriculum.lead)}
      <div class="week-tools">
        <button class="chip" data-expand="open">모두 펼치기</button>
        <button class="chip" data-expand="close">모두 접기</button>
      </div>
      <div class="week-list">${weeks.map((w) => {
        const now = isThisWeek(w);
        return `
        <details class="card week-card${now ? " current" : ""}" id="week-${w.no}"${now ? " open" : ""}>
          <summary>
            <span class="week-no">${w.no}<small>주</small></span>
            <span class="week-main">
              <span class="week-dates">${w.sessions.map((s) => md(s.date)).join(" · ")}</span>
              <strong>${esc(w.title)}</strong>
            </span>
            <span class="week-badges">
              ${now ? `<span class="badge now">이번 주</span>` : ""}
              ${w.sessions.some((s) => s.holiday) ? `<span class="badge off">휴강 포함</span>` : ""}
              ${w.assignments.length ? `<span class="badge hw">과제</span>` : ""}
            </span>
          </summary>
          <div class="week-body">${weekDetail(w)}</div>
        </details>`;
      }).join("")}</div>
    </section>`;

  const schedule = `
    <section id="schedule">
      ${sectionHead(S.title, S.lead)}
      <div class="calendar-wrap">
        <div class="card calendar">
          <div class="cal-head">
            <button class="cal-nav" data-month="-1" aria-label="이전 달">‹</button>
            <h3 id="calTitle" aria-live="polite"></h3>
            <button class="cal-nav" data-month="1" aria-label="다음 달">›</button>
          </div>
          <div class="cal-sub">
            <span>매주 ${S.days.map((d) => DOW[d]).join("·")} ${timeRange}</span>
            <button class="chip" id="calToday">오늘</button>
          </div>
          <div class="cal-grid cal-dow">${[...DOW].map((d) => `<span>${d}</span>`).join("")}</div>
          <div class="cal-grid" id="calDays"></div>
          <div class="cal-legend">
            <span><i class="dot class"></i>수업</span>
            <span><i class="dot off"></i>휴강</span>
            <span><i class="dot hw"></i>과제 마감</span>
          </div>
        </div>
        <div class="card cal-detail" id="calDetail" aria-live="polite"></div>
      </div>
    </section>`;

  const tools = `
    <section id="tools">
      ${sectionHead(C.tools.title, C.tools.lead)}
      <div class="grid tools-grid">${C.tools.items.map((t) => `
        <article class="card tool">
          <div class="card-icon">${esc(t.icon)}</div>
          <div><h3>${esc(t.name)}</h3><p>${esc(t.use)}</p></div>
        </article>`).join("")}</div>
    </section>`;

  const guide = `
    <section id="guide">
      ${sectionHead(C.guide.title, C.guide.lead)}
      <div class="grid">${C.guide.cards.map((c) =>
        iconCard(c, `<ul>${c.lines.map((l) => `<li>${esc(l)}</li>`).join("")}</ul>`)).join("")}</div>
    </section>`;

  const faq = `
    <section id="faq">
      ${sectionHead(C.faq.title, C.faq.lead)}
      <div class="faq-list">${C.faq.items.map((f) => `
        <details class="card faq-item">
          <summary>${esc(f.q)}</summary>
          <div class="answer">${esc(f.a)}</div>
        </details>`).join("")}</div>
    </section>`;

  // participate · student 섹션 내용은 participate.js 가 채웁니다
  $("#app").innerHTML = hero + `<section id="notices" hidden></section>` + stats + about + curriculum + schedule +
    `<section id="participate"></section><section id="student"></section><section id="quiz"></section>` + tools + guide + faq;

  /* ---------- 푸터: 교수자 소개 ---------- */
  const p = C.instructor;
  $("#instructor").innerHTML = `
    <div class="footer-inner">
      ${p.photo
        ? `<img class="avatar" src="${esc(p.photo)}" alt="${esc(p.name)}">`
        : `<div class="avatar" aria-hidden="true">👩‍🏫</div>`}
      <div class="footer-body">
        <span class="footer-kicker">교수자 소개</span>
        <h3>${esc(p.name)}</h3>
        <p class="role">${esc(p.role)}</p>
        <p class="bio">${esc(p.bio)}</p>
        <div class="tags">${p.fields.map((f) => `<span class="tag">${esc(f)}</span>`).join("")}</div>
      </div>
      <ul class="contact">${p.contact.map((c) => `<li><b>${esc(c.label)}</b>${
        c.href ? `<a href="${esc(c.href)}">${esc(c.value)}</a>` : `<span>${esc(c.value)}</span>`}</li>`).join("")}</ul>
    </div>
    <p class="copyright">${esc(C.site.footer)}</p>`;

  /* ---------- 꽃잎 장식 ---------- */
  const petals = document.createElement("div");
  petals.className = "petals";
  for (let i = 0; i < 14; i++) {
    const s = document.createElement("span");
    s.className = "petal";
    s.style.left = Math.random() * 100 + "vw";
    s.style.animationDuration = 10 + Math.random() * 10 + "s";
    s.style.animationDelay = -Math.random() * 20 + "s";
    const size = 8 + Math.random() * 8;
    s.style.width = size + "px";
    s.style.height = size * 0.8 + "px";
    petals.appendChild(s);
  }
  document.body.prepend(petals);

  /* ---------- 숫자 올라가는 효과 ---------- */
  const counters = [...document.querySelectorAll("[data-count]")];
  const countUp = (el) => {
    const target = Number(el.dataset.count), start = performance.now(), dur = 1200;
    const tick = (now) => {
      const t = Math.min((now - start) / dur, 1);
      el.textContent = Math.round(target * (1 - Math.pow(1 - t, 3)));
      if (t < 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  };
  if (!reduceMotion && "IntersectionObserver" in window) {
    counters.forEach((el) => (el.textContent = "0"));
    const io = new IntersectionObserver((entries) => entries.forEach((e) => {
      if (e.isIntersecting) { countUp(e.target); io.unobserve(e.target); }
    }), { threshold: 0.6 });
    counters.forEach((el) => io.observe(el));
  }

  /* ---------- 장점 슬라이드 ---------- */
  const track = $(".slider-track");
  const slides = [...track.children];
  const dots = [...document.querySelectorAll(".slider-dots button")];
  const slideStep = () => slides[0].getBoundingClientRect().width +
    parseFloat(getComputedStyle(track).columnGap || 0);
  const currentIndex = () => Math.round(track.scrollLeft / slideStep());
  const atEnd = () => track.scrollLeft + track.clientWidth >= track.scrollWidth - 4;
  const goTo = (i) => track.scrollTo({ left: i * slideStep(), behavior: "smooth" });
  const updateDots = () => {
    const idx = atEnd() ? slides.length - 1 : currentIndex();
    dots.forEach((d, i) => d.classList.toggle("active", i === idx));
    $(".slider-btn.prev").disabled = track.scrollLeft <= 4;
    $(".slider-btn.next").disabled = atEnd();
  };
  $(".slider-btn.prev").addEventListener("click", () => goTo(currentIndex() - 1));
  $(".slider-btn.next").addEventListener("click", () => goTo(currentIndex() + 1));
  dots.forEach((d, i) => d.addEventListener("click", () => goTo(i)));
  track.addEventListener("scroll", updateDots, { passive: true });
  track.addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight") { e.preventDefault(); goTo(currentIndex() + 1); }
    if (e.key === "ArrowLeft") { e.preventDefault(); goTo(currentIndex() - 1); }
  });
  window.addEventListener("resize", updateDots);
  updateDots();

  // 자동 넘김 (마우스를 올리거나 터치하면 멈춤)
  if (!reduceMotion) {
    let paused = false;
    const slider = $(".slider");
    ["mouseenter", "touchstart", "focusin"].forEach((ev) =>
      slider.addEventListener(ev, () => (paused = true), { passive: true }));
    ["mouseleave", "focusout"].forEach((ev) => slider.addEventListener(ev, () => (paused = false)));
    setInterval(() => {
      if (paused || document.hidden) return;
      goTo(atEnd() ? 0 : currentIndex() + 1);
    }, 5000);
  }

  /* ---------- 과제 마감까지 남은 시간 ---------- */
  const remaining = (due) => {
    const ms = due - Date.now();
    if (ms <= 0) return { text: "마감되었습니다", state: "closed" };
    const min = Math.floor(ms / 60000);
    const d = Math.floor(min / 1440), h = Math.floor((min % 1440) / 60), m = min % 60;
    const left = d > 0 ? `${d}일 ${h}시간` : h > 0 ? `${h}시간 ${m}분` : `${m}분`;
    const dayOf = (t) => { const x = new Date(t); x.setHours(0, 0, 0, 0); return x; };
    const days = Math.round((dayOf(due) - dayOf(Date.now())) / 86400000);
    const dday = days === 0 ? "D-DAY" : `D-${days}`;
    return { text: `${dday} · ${left} 남음`, state: ms < 3 * 86400000 ? "soon" : "open" };
  };
  const updateCountdowns = () => {
    document.querySelectorAll(".countdown[data-due]").forEach((el) => {
      const r = remaining(Number(el.dataset.due));
      el.textContent = r.text;
      el.dataset.state = r.state;
    });
    document.querySelectorAll(".submit-btn[data-due]").forEach((btn) => {
      const closed = Number(btn.dataset.due) <= Date.now();
      btn.classList.toggle("disabled", closed);
      btn.setAttribute("aria-disabled", closed);
      btn.textContent = closed ? "제출 마감" : "제출하기";
    });
  };
  document.addEventListener("click", (e) => {
    const btn = e.target.closest(".submit-btn.disabled");
    if (btn) e.preventDefault();
  });
  updateCountdowns();
  setInterval(updateCountdowns, 30000);

  /* ---------- 주차 모두 펼치기/접기, 주차로 이동 ---------- */
  document.querySelectorAll("[data-expand]").forEach((b) => b.addEventListener("click", () => {
    const open = b.dataset.expand === "open";
    document.querySelectorAll(".week-card").forEach((d) => (d.open = open));
  }));
  const openWeek = (no) => {
    const el = document.getElementById(`week-${no}`);
    if (!el) return;
    el.open = true;
    el.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "start" });
  };

  /* ---------- 월간 달력 ---------- */
  const calDays = $("#calDays"), calDetail = $("#calDetail");
  const allKeys = Object.keys(sessionsByDate).sort();
  const today = new Date();
  const lastDate = parseDate(allKeys[allKeys.length - 1] || S.startDate);
  const inSemester = today >= startDate && today <= lastDate;
  let viewMonth = inSemester ? new Date(today.getFullYear(), today.getMonth(), 1)
                             : new Date(startDate.getFullYear(), startDate.getMonth(), 1);
  let selectedKey = inSemester ? todayKey : allKeys[0];

  const renderCalendar = () => {
    const y = viewMonth.getFullYear(), m = viewMonth.getMonth();
    $("#calTitle").textContent = `${y}년 ${m + 1}월`;
    const first = new Date(y, m, 1), daysInMonth = new Date(y, m + 1, 0).getDate();
    let html = "";
    for (let i = 0; i < first.getDay(); i++) html += `<span class="cal-cell empty"></span>`;
    for (let d = 1; d <= daysInMonth; d++) {
      const date = new Date(y, m, d), key = ymd(date);
      const s = sessionsByDate[key], dues = dueByDate[key];
      const cls = ["cal-cell"];
      if (s) cls.push(s.holiday ? "off" : "class");
      if (dues) cls.push("hw");
      if (key === todayKey) cls.push("today");
      if (key === selectedKey) cls.push("selected");
      if (date.getDay() === 0) cls.push("sun");
      const label = s ? (s.holiday ? "휴강" : `${s.week.no}주차`) : "";
      html += `
        <button class="${cls.join(" ")}" data-key="${key}" aria-label="${fullDate(date)}${
          s ? (s.holiday ? ", 휴강" : `, ${s.week.no}주차 수업`) : ""}${dues ? ", 과제 마감" : ""}">
          <span class="num">${d}</span>
          ${label ? `<span class="cal-label">${label}</span>` : ""}
          ${dues ? `<i class="dot hw"></i>` : ""}
        </button>`;
    }
    calDays.innerHTML = html;
  };

  const nextSessionFrom = (key) => allKeys.find((k) => k > key && !sessionsByDate[k].holiday);

  const renderDetail = (key) => {
    const date = parseDate(key), s = sessionsByDate[key], dues = dueByDate[key] || [];
    let html = `<span class="detail-date">${fullDate(date)}</span>`;
    if (s && s.holiday) {
      html += `<h3>휴강</h3><p class="muted">${esc(s.holiday)}으로 수업이 없습니다.</p>`;
    } else if (s) {
      const w = s.week;
      html += `
        <h3><span class="badge now">${w.no}주차</span> ${esc(s.topic || w.title)}</h3>
        <ul class="detail-meta">
          <li>⏰ ${timeRange}</li>
          <li>📍 ${esc(w.place)}</li>
        </ul>
        <h4>📖 ${esc(w.title)}</h4>
        <ul class="content-list">${(w.contents || []).map((c) => `<li>${esc(c)}</li>`).join("")}</ul>
        ${videoLinks(w.videos)}`;
    } else {
      html += `<h3>수업이 없는 날</h3>`;
    }
    dues.forEach((a) => {
      html += `<p class="detail-due">📌 <b>${esc(a.title)}</b> 마감 ${pad(a.dueDate.getHours())}:${pad(a.dueDate.getMinutes())}
        <span class="countdown" data-due="${a.dueDate.getTime()}"></span></p>`;
    });
    const nextKey = !s || s.holiday ? nextSessionFrom(key) : null;
    html += `<div class="detail-actions">`;
    if (s) html += `<button class="btn" data-week="${s.week.no}">${s.week.no}주차 자세히 보기</button>`;
    if (nextKey) html += `<button class="btn primary" data-goto="${nextKey}">다음 수업 ${md(parseDate(nextKey))}</button>`;
    html += `</div>`;
    calDetail.innerHTML = html;
    updateCountdowns();
  };

  const select = (key) => {
    selectedKey = key;
    const d = parseDate(key);
    viewMonth = new Date(d.getFullYear(), d.getMonth(), 1);
    renderCalendar();
    renderDetail(key);
  };

  calDays.addEventListener("click", (e) => {
    const cell = e.target.closest(".cal-cell[data-key]");
    if (cell) select(cell.dataset.key);
  });
  document.querySelectorAll(".cal-nav").forEach((b) => b.addEventListener("click", () => {
    viewMonth = new Date(viewMonth.getFullYear(), viewMonth.getMonth() + Number(b.dataset.month), 1);
    renderCalendar();
  }));
  $("#calToday").addEventListener("click", () => select(todayKey));
  calDetail.addEventListener("click", (e) => {
    const w = e.target.closest("[data-week]"), g = e.target.closest("[data-goto]");
    if (w) openWeek(w.dataset.week);
    if (g) select(g.dataset.goto);
  });
  select(selectedKey);

  // participate.js 에서 함께 쓰는 도구
  window.SITE = { $, esc, sectionHead, reduceMotion, parseDate, ymd, md, pad, fullDate, fmtDue,
    weeks, sessionsByDate, allKeys, remaining, updateCountdowns };

  /* ---------- 모바일 메뉴 ---------- */
  const nav = $("#siteNav"), toggle = $("#menuToggle");
  const setMenu = (open) => {
    nav.classList.toggle("open", open);
    toggle.setAttribute("aria-expanded", open);
    toggle.setAttribute("aria-label", open ? "메뉴 닫기" : "메뉴 열기");
  };
  toggle.addEventListener("click", () => setMenu(!nav.classList.contains("open")));
  nav.addEventListener("click", (e) => { if (e.target.tagName === "A") setMenu(false); });
  document.addEventListener("click", (e) => {
    if (!e.target.closest(".site-header")) setMenu(false);
  });

  /* ---------- 스크롤: 헤더 그림자 · 맨 위로 버튼 · 현재 메뉴 표시 ---------- */
  const header = $(".site-header"), toTop = $("#toTop");
  const links = [...nav.querySelectorAll("a")];
  const sections = C.nav.map((n) => document.getElementById(n.id)).filter(Boolean)
    .sort((a, b) => (a.compareDocumentPosition(b) & Node.DOCUMENT_POSITION_FOLLOWING ? -1 : 1));
  const onScroll = () => {
    const y = window.scrollY;
    header.classList.toggle("scrolled", y > 10);
    toTop.classList.toggle("show", y > 400);
    let current = "";
    for (const s of sections) if (s.getBoundingClientRect().top < 120) current = s.id;
    if (window.innerHeight + y >= document.documentElement.scrollHeight - 4 && sections.length)
      current = sections[sections.length - 1].id;
    links.forEach((a) => a.classList.toggle("active", a.dataset.id === current));
  };
  window.addEventListener("scroll", onScroll, { passive: true });
  onScroll();
  toTop.addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));
})();

</script>
<script data-bundle>
// 수강생 참여 기능: 투표 · 회원가입 · 로그인/출석/과제 제출 · 안내 팝업 · 첫 방문 폭죽
// 내용 수정은 config.js 에서 하세요.
(function () {
  const C = window.SITE_CONFIG, U = window.SITE;
  const { $, esc, sectionHead } = U;
  const P = C.participate, ST = C.student, B = C.backend || {};
  const DEMO = !B.url;

  /* ---------- 브라우저 저장소 (실패해도 동작하도록) ---------- */
  const local = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* 저장 불가 환경 */ } }
  };
  const session = {
    get(k) { try { return JSON.parse(sessionStorage.getItem(k)); } catch { return null; } },
    set(k, v) { try { v == null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, JSON.stringify(v)); } catch { /* */ } }
  };

  /* ---------- 서버 통신 (Google Apps Script) / 데모 모드 ---------- */
  async function api(action, data = {}) {
    if (DEMO) return demoApi(action, data);
    const res = await fetch(B.url, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" }, // 사전 요청(CORS) 없이 보내기
      body: JSON.stringify({ action, ...data })
    });
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || "요청을 처리하지 못했습니다.");
    return json;
  }

  // 데모 모드: 이 브라우저에만 저장
  function demoApi(action, d) {
    const db = local.get("demo.db", { votes: {}, voters: {}, applications: [], attendance: [], submissions: [] });
    db.students ||= [];
    db.notices ||= JSON.parse(JSON.stringify((C.notices && C.notices.items) || []));
    const save = () => local.set("demo.db", db);
    const fail = (msg) => Promise.reject(new Error(msg));
    const t = new Date();
    const now = `${U.ymd(t)} ${U.pad(t.getHours())}:${U.pad(t.getMinutes())}:${U.pad(t.getSeconds())}`;
    const findStudent = (id) => db.students.find((s) => String(s.studentId) === String(id));
    switch (action) {
      case "notices":
        return Promise.resolve({ ok: true, notices: db.notices });
      case "admin": // 데모에서는 비밀번호를 화면에서만 확인
        switch (d.op) {
          case "data":
            return Promise.resolve({ ok: true, students: db.students, applications: db.applications,
              attendance: db.attendance.map((a) => ({ ...a, name: a.name || (findStudent(a.studentId) || {}).name || "" })),
              submissions: db.submissions.map((s) => ({ ...s, name: s.name || (findStudent(s.studentId) || {}).name || "" })),
              votes: db.votes, notices: db.notices });
          case "saveStudents": db.students = d.students; save(); return Promise.resolve({ ok: true });
          case "postNotice": db.notices.push(d.notice); save(); return Promise.resolve({ ok: true });
          case "deleteNotice": db.notices = db.notices.filter((n) => n.id !== d.id); save(); return Promise.resolve({ ok: true });
          default: return fail("알 수 없는 관리자 요청입니다.");
        }
      case "results": {
        const counts = db.votes[d.pollId] || {};
        return Promise.resolve({ ok: true, counts });
      }
      case "vote": {
        const key = `${d.pollId}:${d.voterId}`;
        if (db.voters[key]) return fail("이미 투표하셨습니다.");
        db.voters[key] = true;
        const counts = (db.votes[d.pollId] ||= {});
        counts[d.option] = (counts[d.option] || 0) + 1;
        save();
        return Promise.resolve({ ok: true, counts });
      }
      case "apply":
        db.applications.push({ "제출 시각": now, ...d.form }); save();
        return Promise.resolve({ ok: true });
      case "login": {
        if (!d.studentId || !d.code) return fail("학번과 접속 코드를 입력해 주세요.");
        // 명단이 등록돼 있으면 명단으로 확인, 없으면 데모용으로 누구나 통과
        if (!db.students.length) return Promise.resolve({ ok: true, name: "데모 수강생" });
        const s = findStudent(d.studentId);
        if (!s || String(s.code) !== String(d.code)) return fail("학번 또는 접속 코드가 맞지 않습니다.");
        return Promise.resolve({ ok: true, name: s.name });
      }
      case "attend": {
        if (db.attendance.some((a) => a.studentId === d.studentId && a.date === d.date))
          return fail("오늘은 이미 출석했습니다.");
        db.attendance.push({ studentId: d.studentId, name: d.name, date: d.date, time: d.time, status: d.status }); save();
        return Promise.resolve({ ok: true });
      }
      case "submit":
        // 데모에서는 파일 내용은 저장하지 않고 기록만 남깁니다
        db.submissions.push({ studentId: d.studentId, name: d.name, assignment: d.assignment, fileName: d.fileName, at: now }); save();
        return Promise.resolve({ ok: true });
      case "records":
        return Promise.resolve({ ok: true,
          attendance: db.attendance.filter((a) => a.studentId === d.studentId),
          submissions: db.submissions.filter((s) => s.studentId === d.studentId) });
      default:
        return fail("알 수 없는 요청입니다.");
    }
  }

  const demoNote = DEMO ? `
    <p class="demo-note">🧪 <b>데모 모드</b> · 서버가 연결되지 않아 입력한 내용이 이 브라우저에만 저장됩니다.
      실제 운영은 <code>config.js</code> 의 <code>backend.url</code> 을 설정하세요.</p>` : "";

  // admin.js 에서 함께 사용
  Object.assign(U, { api, DEMO, local, session, confetti, toast });
  // QR 로 퀴즈에 들어온 학생에게는 팝업·환영 효과를 띄우지 않음
  const joiningQuiz = new URLSearchParams(location.search).has("quiz");

  /* =========================================================
   * 0. 공지사항
   * ========================================================= */
  const noticeEl = $("#notices");
  const isNew = (date) => (Date.now() - U.parseDate(date)) / 86400000 < 4;
  const renderNotices = (list) => {
    const items = [...list].sort((a, b) => (b.pinned === true) - (a.pinned === true) || String(b.date).localeCompare(String(a.date)));
    noticeEl.hidden = !items.length;
    if (!items.length) return;
    noticeEl.innerHTML = `
      <div class="notice-box card">
        <h2 class="notice-title">📢 ${esc((C.notices && C.notices.title) || "공지사항")}</h2>
        <ul class="notice-list">${items.map((n) => `
          <li>
            <details>
              <summary>
                ${n.pinned ? `<span class="badge hw">중요</span>` : ""}
                ${isNew(n.date) ? `<span class="badge now">NEW</span>` : ""}
                <span class="notice-text">${esc(n.title)}</span>
                <time>${esc(n.date)}</time>
              </summary>
              <p>${esc(n.body).replace(/\n/g, "<br>")}</p>
            </details>
          </li>`).join("")}</ul>
      </div>`;
  };
  U.loadNotices = () => api("notices").then((r) => renderNotices(r.notices || []))
    .catch(() => renderNotices((C.notices && C.notices.items) || []));
  U.loadNotices();

  /* =========================================================
   * 1. 투표 + 회원가입
   * ========================================================= */
  const poll = P.poll, form = P.form;
  let voterId = local.get("voterId", null);
  if (!voterId) { voterId = Math.random().toString(36).slice(2) + Date.now().toString(36); local.set("voterId", voterId); }
  const votedKey = `voted:${poll.id}`;

  const fieldHtml = (f) => {
    const id = `f-${f.name}`, req = f.required ? ` <span class="req">*</span>` : "";
    const common = `id="${id}" name="${esc(f.name)}" aria-describedby="${id}-err"${f.autocomplete ? ` autocomplete="${esc(f.autocomplete)}"` : ""}`;
    let input;
    if (f.type === "select") {
      input = `<select ${common}><option value="">선택해 주세요</option>${
        f.options.map((o) => `<option>${esc(o)}</option>`).join("")}</select>`;
    } else if (f.type === "textarea") {
      input = `<textarea ${common} rows="4" placeholder="${esc(f.placeholder || "")}"></textarea>`;
    } else if (f.type === "checkbox") {
      return `
        <div class="field field-check" data-field="${esc(f.name)}">
          <label><input type="checkbox" ${common}> ${esc(f.label)}${req}</label>
          <p class="field-error" id="${id}-err"></p>
        </div>`;
    } else {
      input = `<input type="${esc(f.type || "text")}" ${common} placeholder="${esc(f.placeholder || "")}">`;
    }
    return `
      <div class="field${f.type === "textarea" ? " wide" : ""}" data-field="${esc(f.name)}">
        <label for="${id}">${esc(f.label)}${req}</label>
        ${input}
        <p class="field-error" id="${id}-err"></p>
      </div>`;
  };

  $("#participate").innerHTML = `
    ${sectionHead(P.title, P.lead)}
    ${demoNote}
    <div class="participate-grid">
      <article class="card poll" aria-labelledby="pollQ">
        <div class="poll-head">
          <span class="live-dot" aria-hidden="true"></span><span class="live-text">실시간 투표</span>
        </div>
        <h3 id="pollQ">${esc(poll.question)}</h3>
        <form id="pollForm" class="poll-options">
          ${poll.options.map((o) => `
            <label class="poll-option">
              <input type="radio" name="option" value="${esc(o.id)}">
              <span>${esc(o.label)}</span>
            </label>`).join("")}
          <button class="btn primary" type="submit">투표하기</button>
          <p class="form-msg" id="pollMsg" role="status"></p>
        </form>
        <div class="poll-results" id="pollResults" aria-live="polite"></div>
        <p class="poll-meta" id="pollMeta"></p>
      </article>

      <article class="card apply" id="apply">
        <h3>${esc(form.title)}</h3>
        <p class="muted small">${esc(form.lead)}</p>
        <div class="error-summary" id="applySummary" role="alert" hidden></div>
        <form id="applyForm" novalidate>
          <div class="fields">${form.fields.map(fieldHtml).join("")}</div>
          <button class="btn primary wide-btn" type="submit">회원가입</button>
          <p class="form-msg" id="applyMsg" role="status"></p>
        </form>
        <div class="apply-done" id="applyDone" hidden>
          <div class="done-icon">🌸</div>
          <h3>${esc(form.successTitle)}</h3>
          <p>${esc(form.successText)}</p>
          <button class="btn" id="applyAgain">다시 가입하기</button>
        </div>
      </article>
    </div>`;

  /* ----- 투표 ----- */
  const pollForm = $("#pollForm"), pollResults = $("#pollResults"), pollMeta = $("#pollMeta"), pollMsg = $("#pollMsg");
  const renderResults = (counts) => {
    const total = poll.options.reduce((s, o) => s + (counts[o.id] || 0), 0);
    const max = Math.max(1, ...poll.options.map((o) => counts[o.id] || 0));
    const mine = local.get(votedKey, null);
    pollResults.innerHTML = poll.options.map((o) => {
      const n = counts[o.id] || 0, pct = total ? Math.round((n / total) * 100) : 0;
      return `
        <div class="bar-row${mine === o.id ? " mine" : ""}${n === max && n > 0 ? " top" : ""}">
          <div class="bar-label"><span>${esc(o.label)}${mine === o.id ? ' <em>내 선택</em>' : ""}</span><b>${n}표 · ${pct}%</b></div>
          <div class="bar-track" role="img" aria-label="${esc(o.label)} ${n}표, ${pct}%">
            <div class="bar-fill" style="width:${(n / max) * 100}%"></div>
          </div>
        </div>`;
    }).join("");
    const t = new Date();
    pollMeta.textContent = `총 ${total}명 참여 · ${U.pad(t.getHours())}:${U.pad(t.getMinutes())}:${U.pad(t.getSeconds())} 기준 · ${poll.refreshSeconds}초마다 자동 갱신`;
  };
  const setVoted = () => {
    const done = !!local.get(votedKey, null);
    pollForm.classList.toggle("voted", done);
    pollForm.querySelectorAll("input, button").forEach((el) => (el.disabled = done));
    if (done) pollMsg.textContent = "투표해 주셔서 감사합니다! 결과는 계속 갱신됩니다.";
  };
  const loadResults = () => api("results", { pollId: poll.id })
    .then((r) => renderResults(r.counts || {}))
    .catch(() => { pollMeta.textContent = "결과를 불러오지 못했습니다. 잠시 후 다시 시도합니다."; });

  pollForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    const choice = pollForm.option.value;
    if (!choice) { pollMsg.textContent = "주제를 하나 골라 주세요."; pollMsg.className = "form-msg error"; return; }
    pollMsg.className = "form-msg"; pollMsg.textContent = "투표하는 중…";
    try {
      const r = await api("vote", { pollId: poll.id, voterId, option: choice });
      local.set(votedKey, choice);
      setVoted();
      renderResults(r.counts || {});
    } catch (err) {
      pollMsg.className = "form-msg error"; pollMsg.textContent = err.message;
      if (/이미/.test(err.message)) { local.set(votedKey, choice); setVoted(); }
    }
  });
  setVoted();
  loadResults();
  setInterval(() => { if (!document.hidden) loadResults(); }, Math.max(3, poll.refreshSeconds) * 1000);

  /* ----- 회원가입 ----- */
  // SHA-256 계산은 admin.js 의 U.sha256 을 같이 씀 (브라우저 기능이 없어도 동작)
  const hashPassword = (pw) => U.sha256(((C.admin && C.admin.salt) || "") + pw);
  const applyForm = $("#applyForm"), summary = $("#applySummary");
  const validate = () => {
    const errors = [];
    form.fields.forEach((f) => {
      const el = applyForm.elements[f.name], box = applyForm.querySelector(`[data-field="${f.name}"]`);
      const value = f.type === "checkbox" ? el.checked : f.type === "password" ? el.value : el.value.trim();
      let msg = "";
      if (f.required && !value)
        msg = f.type === "checkbox" ? "동의가 필요합니다." : f.type === "select" ? "선택해 주세요." : "입력해 주세요.";
      else if (value && f.type === "email" && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value)) msg = "이메일 형식을 확인해 주세요.";
      else if (value && f.pattern && f.type !== "checkbox" && !new RegExp(f.pattern).test(value)) msg = f.patternMessage || "형식을 확인해 주세요.";
      else if (value && f.match && value !== applyForm.elements[f.match].value) msg = f.matchMessage || "값이 일치하지 않습니다.";
      box.classList.toggle("invalid", !!msg);
      el.setAttribute("aria-invalid", !!msg);
      box.querySelector(".field-error").textContent = msg;
      if (msg) errors.push({ f, msg, el });
    });
    return errors;
  };
  applyForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    const errors = validate();
    if (errors.length) {
      summary.hidden = false;
      summary.innerHTML = `<b>빠진 항목이나 잘못된 입력이 ${errors.length}개 있습니다.</b>
        <ul>${errors.map((x) => `<li><a href="#f-${esc(x.f.name)}">${esc(x.f.label.replace(/\(.*\)|에 동의합니다\./g, ""))}</a> — ${esc(x.msg)}</li>`).join("")}</ul>`;
      summary.scrollIntoView({ behavior: U.reduceMotion ? "auto" : "smooth", block: "center" });
      errors[0].el.focus({ preventScroll: true });
      return;
    }
    summary.hidden = true;
    const btn = applyForm.querySelector("button[type=submit]"), msg = $("#applyMsg");
    btn.disabled = true; msg.className = "form-msg"; msg.textContent = "제출하는 중…";
    const data = {};
    try {
      for (const f of form.fields) {
        if (f.match) continue; // 확인용 칸은 저장하지 않음
        const el = applyForm.elements[f.name];
        // 비밀번호는 원문 대신 해시값만 저장
        data[f.name] = f.type === "checkbox" ? (el.checked ? "동의" : "")
          : f.type === "password" ? await hashPassword(el.value) : el.value.trim();
      }
      await api("apply", { form: data });
      applyForm.reset(); msg.textContent = "";
      applyForm.hidden = true; $("#applyDone").hidden = false;
    } catch (err) {
      msg.className = "form-msg error"; msg.textContent = `제출하지 못했습니다: ${err.message}`;
    } finally { btn.disabled = false; }
  });
  // 고친 항목은 바로 오류 표시를 지움
  applyForm.addEventListener("input", (e) => {
    const box = e.target.closest(".field");
    if (box && box.classList.contains("invalid")) {
      box.classList.remove("invalid");
      box.querySelector(".field-error").textContent = "";
      e.target.setAttribute("aria-invalid", false);
    }
  });
  summary.addEventListener("click", (e) => {
    const a = e.target.closest("a[href^='#f-']");
    if (a) { e.preventDefault(); const el = document.querySelector(a.getAttribute("href")); el.scrollIntoView({ block: "center" }); el.focus({ preventScroll: true }); }
  });
  $("#applyAgain").addEventListener("click", () => { $("#applyDone").hidden = true; applyForm.hidden = false; });

  /* =========================================================
   * 2. 수강생 공간: 로그인 · 출석 · 과제 제출
   * ========================================================= */
  const studentEl = $("#student");
  const A = ST.attendance;
  const assignments = U.weeks.flatMap((w) => w.assignments.map((a) => ({ ...a, weekNo: w.no })));
  let user = session.get("student");
  let records = { attendance: [], submissions: [] };

  const renderStudent = () => {
    if (!user) {
      studentEl.innerHTML = `
        ${sectionHead(ST.title, ST.lead)}
        ${demoNote}
        <article class="card login-card">
          <div class="card-icon">🔐</div>
          <h3>수강생 로그인</h3>
          <form id="loginForm" novalidate>
            <div class="field"><label for="loginId">학번</label>
              <input id="loginId" name="studentId" inputmode="numeric" autocomplete="username" placeholder="2023123456"></div>
            <div class="field"><label for="loginCode">접속 코드</label>
              <input id="loginCode" name="code" type="password" autocomplete="current-password"></div>
            <button class="btn primary wide-btn" type="submit">로그인</button>
            <p class="form-msg" id="loginMsg" role="status"></p>
          </form>
          <p class="muted small">${esc(ST.loginHelp)}${DEMO ? " (데모: 아무 학번과 코드나 입력하세요)" : ""}</p>
        </article>`;
      $("#loginForm").addEventListener("submit", onLogin);
      return;
    }
    const open = assignments.filter((a) => a.dueDate > Date.now());
    studentEl.innerHTML = `
      ${sectionHead(ST.title, ST.lead)}
      ${demoNote}
      <div class="student-bar card">
        <span>👋 <b>${esc(user.name)}</b>님 (${esc(user.studentId)}) 환영합니다</span>
        <button class="chip" id="logoutBtn">로그아웃</button>
      </div>
      <div class="student-grid">
        <article class="card">
          <div class="card-icon">✅</div>
          <h3>출석 체크</h3>
          <div id="attendBox"></div>
        </article>
        <article class="card">
          <div class="card-icon">📤</div>
          <h3>과제 제출</h3>
          ${open.length ? `
          <form id="submitForm" novalidate>
            <div class="field"><label for="hwSelect">과제 선택</label>
              <select id="hwSelect" name="assignment">${open.map((a) =>
                `<option value="${esc(a.title)}" data-due="${a.dueDate.getTime()}">${a.weekNo}주차 · ${esc(a.title)}</option>`).join("")}</select>
              <p class="small muted" id="hwDue"></p>
            </div>
            <label class="dropzone" id="dropzone">
              <input type="file" id="hwFile" name="file">
              <span class="dz-icon">📎</span>
              <span id="dzText">파일을 끌어다 놓거나 눌러서 선택하세요<br><small>최대 ${B.maxFileMB || 10}MB</small></span>
            </label>
            <button class="btn primary wide-btn" type="submit">제출하기</button>
            <p class="form-msg" id="submitMsg" role="status"></p>
          </form>` : `<p class="muted">지금 제출할 수 있는 과제가 없습니다.</p>`}
        </article>
      </div>
      <article class="card records">
        <h3>나의 기록</h3>
        <div class="records-grid">
          <div><h4>출석</h4><ul id="attList" class="record-list"></ul></div>
          <div><h4>제출한 과제</h4><ul id="subList" class="record-list"></ul></div>
        </div>
      </article>`;

    $("#logoutBtn").addEventListener("click", () => { user = null; session.set("student", null); renderStudent(); });
    if (open.length) setupSubmit();
    renderAttendance();
    loadRecords();
  };

  async function onLogin(e) {
    e.preventDefault();
    const f = e.target, msg = $("#loginMsg");
    const studentId = f.studentId.value.trim(), code = f.code.value.trim();
    if (!studentId || !code) { msg.className = "form-msg error"; msg.textContent = "학번과 접속 코드를 모두 입력해 주세요."; return; }
    msg.className = "form-msg"; msg.textContent = "확인하는 중…";
    try {
      const r = await api("login", { studentId, code });
      user = { studentId, code, name: r.name || studentId };
      session.set("student", user);
      renderStudent();
    } catch (err) { msg.className = "form-msg error"; msg.textContent = err.message; }
  }

  const auth = () => ({ studentId: user.studentId, code: user.code, name: user.name });
  const hm = (d) => `${U.pad(d.getHours())}:${U.pad(d.getMinutes())}`;
  const atTime = (date, hhmm, addMin = 0) => {
    const [h, m] = hhmm.split(":").map(Number), d = new Date(date);
    d.setHours(h, m + addMin, 0, 0); return d;
  };

  function renderAttendance() {
    const box = $("#attendBox");
    if (!box) return;
    const now = new Date(), key = U.ymd(now), s = U.sessionsByDate[key];
    const done = records.attendance.find((a) => a.date === key);
    const next = U.allKeys.find((k) => k > key && !U.sessionsByDate[k].holiday);
    const nextText = next ? `다음 수업: ${U.md(U.parseDate(next))} ${C.schedule.startTime}` : "남은 수업이 없습니다.";
    if (done) {
      box.innerHTML = `<p class="att-status ok">출석 완료 · ${esc(done.time)} (${esc(done.status)})</p><p class="muted small">${nextText}</p>`;
      return;
    }
    if (!s || s.holiday) {
      box.innerHTML = `<p class="att-status">${s ? `오늘은 휴강입니다 (${esc(s.holiday)})` : "오늘은 수업이 없습니다."}</p><p class="muted small">${nextText}</p>`;
      return;
    }
    const opens = atTime(now, C.schedule.startTime, -A.openBeforeMinutes);
    const lateAt = atTime(now, C.schedule.startTime, A.lateAfterMinutes);
    const closes = atTime(now, C.schedule.endTime);
    const info = `<p class="muted small">${s.week.no}주차 · ${esc(s.topic || s.week.title)}<br>출석 가능 ${hm(opens)} – ${hm(closes)} · ${hm(lateAt)} 이후 지각</p>`;
    if (now < opens) { box.innerHTML = `<p class="att-status">출석은 ${hm(opens)}부터 가능합니다.</p>${info}`; return; }
    if (A.closeAtEnd && now > closes) { box.innerHTML = `<p class="att-status">오늘 출석 시간이 끝났습니다.</p>${info}`; return; }
    const late = now > lateAt;
    box.innerHTML = `
      <p class="att-status ${late ? "late" : "open"}">${late ? "지금 체크하면 '지각'으로 기록됩니다." : "지금 출석할 수 있습니다."}</p>
      ${info}
      <button class="btn primary wide-btn" id="attendBtn">출석 체크</button>
      <p class="form-msg" id="attendMsg" role="status"></p>`;
    $("#attendBtn").addEventListener("click", async (e) => {
      const btn = e.currentTarget, msg = $("#attendMsg"), t = new Date();
      btn.disabled = true; msg.className = "form-msg"; msg.textContent = "기록하는 중…";
      try {
        await api("attend", { ...auth(), date: key, time: hm(t), status: t > lateAt ? "지각" : "출석" });
        await loadRecords();
      } catch (err) { msg.className = "form-msg error"; msg.textContent = err.message; btn.disabled = false; }
    });
  }

  async function loadRecords() {
    try {
      const r = await api("records", auth());
      records = { attendance: r.attendance || [], submissions: r.submissions || [] };
    } catch (err) { /* 기록을 못 불러와도 화면은 유지 */ }
    const att = $("#attList"), sub = $("#subList");
    if (!att) return;
    att.innerHTML = records.attendance.length
      ? records.attendance.map((a) => `<li><span>${U.md(U.parseDate(a.date))}</span><b class="${a.status === "지각" ? "late" : "ok"}">${esc(a.status)}</b> <small>${esc(a.time)}</small></li>`).join("")
      : `<li class="muted">아직 출석 기록이 없습니다.</li>`;
    sub.innerHTML = records.submissions.length
      ? records.submissions.map((s) => `<li><span>${esc(s.assignment)}</span><small>${esc(s.fileName)}${
          s.url ? ` · <a href="${esc(s.url)}" target="_blank" rel="noopener">파일 보기</a>` : ""}</small></li>`).join("")
      : `<li class="muted">아직 제출한 과제가 없습니다.</li>`;
    renderAttendance();
  }

  function setupSubmit() {
    const f = $("#submitForm"), input = $("#hwFile"), dz = $("#dropzone"), dzText = $("#dzText"), sel = $("#hwSelect");
    const maxBytes = (B.maxFileMB || 10) * 1024 * 1024;
    const showDue = () => {
      const due = Number(sel.selectedOptions[0].dataset.due);
      const r = U.remaining(due);
      $("#hwDue").textContent = `마감 ${U.fmtDue(new Date(due))} · ${r.text}`;
    };
    sel.addEventListener("change", showDue); showDue();
    const showFile = () => {
      const file = input.files[0];
      dz.classList.toggle("has-file", !!file);
      dzText.innerHTML = file ? `<b>${esc(file.name)}</b><br><small>${(file.size / 1024 / 1024).toFixed(2)}MB</small>`
        : `파일을 끌어다 놓거나 눌러서 선택하세요<br><small>최대 ${B.maxFileMB || 10}MB</small>`;
    };
    input.addEventListener("change", showFile);
    ["dragenter", "dragover"].forEach((ev) => dz.addEventListener(ev, (e) => { e.preventDefault(); dz.classList.add("drag"); }));
    ["dragleave", "drop"].forEach((ev) => dz.addEventListener(ev, () => dz.classList.remove("drag")));
    dz.addEventListener("drop", (e) => {
      e.preventDefault();
      if (e.dataTransfer.files.length) { input.files = e.dataTransfer.files; showFile(); }
    });
    f.addEventListener("submit", async (e) => {
      e.preventDefault();
      const msg = $("#submitMsg"), file = input.files[0], btn = f.querySelector("button[type=submit]");
      msg.className = "form-msg error";
      if (!file) { msg.textContent = "제출할 파일을 선택해 주세요."; return; }
      if (file.size > maxBytes) { msg.textContent = `파일이 너무 큽니다. ${B.maxFileMB || 10}MB 이하로 올려 주세요.`; return; }
      btn.disabled = true; msg.className = "form-msg"; msg.textContent = "업로드하는 중…";
      try {
        const data = DEMO ? "" : await new Promise((res, rej) => {
          const r = new FileReader();
          r.onload = () => res(String(r.result).split(",")[1]);
          r.onerror = () => rej(new Error("파일을 읽지 못했습니다."));
          r.readAsDataURL(file);
        });
        await api("submit", { ...auth(), assignment: sel.value, fileName: file.name, mimeType: file.type, data });
        msg.className = "form-msg success"; msg.textContent = `‘${file.name}’ 제출 완료!`;
        input.value = ""; showFile();
        loadRecords();
      } catch (err) { msg.className = "form-msg error"; msg.textContent = `제출하지 못했습니다: ${err.message}`; }
      finally { btn.disabled = false; }
    });
  }

  renderStudent();
  setInterval(renderAttendance, 30000);

  /* =========================================================
   * 3. 첫 방문 폭죽 + 회원가입 안내 팝업
   * ========================================================= */
  const firstVisit = !local.get("visited", false);
  local.set("visited", true);

  function toast(text) {
    const t = document.createElement("div");
    t.className = "toast"; t.setAttribute("role", "status"); t.textContent = text;
    document.body.appendChild(t);
    requestAnimationFrame(() => t.classList.add("show"));
    setTimeout(() => { t.classList.remove("show"); setTimeout(() => t.remove(), 400); }, 3200);
  }

  function confetti() {
    const canvas = document.createElement("canvas");
    canvas.className = "confetti";
    document.body.appendChild(canvas);
    const ctx = canvas.getContext("2d"), dpr = window.devicePixelRatio || 1;
    const W = innerWidth, H = innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr; ctx.scale(dpr, dpr);
    const colors = ["#ec8fb5", "#e06a9d", "#f9cfe0", "#b39ddb", "#7e57c2", "#ffd36e", "#ffffff"];
    const parts = [];
    const burst = (x, y, n) => {
      for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2, v = 4 + Math.random() * 7;
        parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 3, r: 3 + Math.random() * 4,
          c: colors[(Math.random() * colors.length) | 0], rot: Math.random() * 6, vr: (Math.random() - .5) * .3,
          petal: Math.random() < .4, life: 0 });
      }
    };
    burst(W * 0.2, H * 0.35, 70);
    setTimeout(() => burst(W * 0.8, H * 0.3, 70), 250);
    setTimeout(() => burst(W * 0.5, H * 0.2, 90), 550);
    const start = performance.now();
    const frame = (now) => {
      ctx.clearRect(0, 0, W, H);
      parts.forEach((p) => {
        p.vy += 0.15; p.vx *= 0.985; p.vy *= 0.985; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life++;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        ctx.globalAlpha = Math.max(0, 1 - p.life / 200);
        ctx.fillStyle = p.c;
        if (p.petal) { ctx.beginPath(); ctx.ellipse(0, 0, p.r * 1.4, p.r * .8, 0, 0, Math.PI * 2); ctx.fill(); }
        else ctx.fillRect(-p.r / 2, -p.r, p.r, p.r * 2);
        ctx.restore();
      });
      if (now - start < 4200) requestAnimationFrame(frame); else canvas.remove();
    };
    requestAnimationFrame(frame);
  }

  if (firstVisit && !joiningQuiz && C.welcome && C.welcome.confetti) {
    setTimeout(() => {
      if (!U.reduceMotion) confetti();
      if (C.welcome.message) toast(C.welcome.message);
    }, 400);
  }

  const pop = C.popup;
  const hideKey = "popup.hideDate";
  if (pop && pop.enabled && !joiningQuiz && local.get(hideKey, "") !== U.ymd(new Date())) {
    setTimeout(openPopup, (pop.delaySeconds || 0) * 1000);
  }

  function openPopup() {
    const lastFocus = document.activeElement;
    const wrap = document.createElement("div");
    wrap.className = "modal-backdrop";
    wrap.innerHTML = `
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="popTitle">
        <button class="modal-x" aria-label="닫기">×</button>
        <div class="modal-icon">🌸</div>
        <h3 id="popTitle">${esc(pop.title)}</h3>
        ${pop.lines.map((l) => `<p>${esc(l)}</p>`).join("")}
        <a class="btn primary wide-btn" href="${esc(pop.buttonHref)}">${esc(pop.buttonLabel)}</a>
        <div class="modal-foot">
          <button data-act="today">오늘 하루 보지 않기</button>
          <button data-act="close">닫기</button>
        </div>
      </div>`;
    document.body.appendChild(wrap);
    requestAnimationFrame(() => wrap.classList.add("show"));
    const close = (hideToday) => {
      if (hideToday) local.set(hideKey, U.ymd(new Date()));
      wrap.classList.remove("show");
      document.removeEventListener("keydown", onKey);
      setTimeout(() => wrap.remove(), 300);
      if (lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll: true });
    };
    const focusables = () => [...wrap.querySelectorAll("a, button")];
    const onKey = (e) => {
      if (e.key === "Escape") close(false);
      if (e.key === "Tab") { // 팝업 안에서만 포커스 이동
        const f = focusables(), first = f[0], last = f[f.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
    };
    document.addEventListener("keydown", onKey);
    wrap.addEventListener("click", (e) => {
      if (e.target === wrap || e.target.closest(".modal-x") || e.target.closest("[data-act=close]")) close(false);
      else if (e.target.closest("[data-act=today]")) close(true);
      else if (e.target.closest(".modal a")) close(false);
    });
    wrap.querySelector(".modal a").focus({ preventScroll: true });
  }
})();

// 관리자 모드: 오른쪽 위 자물쇠 → 비밀번호 → 관리자 화면

(function () {
  const C = window.SITE_CONFIG, U = window.SITE;

  const CFG_FILE = SINGLE ? "index.html" : "config.js";

  /* ---------- SHA-256 (브라우저 기능이 없으면 직접 계산) ---------- */
  async function sha256(text) {
    if (window.crypto && crypto.subtle && window.isSecureContext !== false) {
      try {
        const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
        return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, "0")).join("");
      } catch { /* 아래 직접 계산으로 */ }
    }
    return sha256js(text);
  }
  function sha256js(str) {
    const K = [], H = [];
    let n = 2, c = 0;
    const frac = (x) => ((x - Math.floor(x)) * 4294967296) | 0;
    while (c < 64) {
      let prime = true;
      for (let f = 2; f * f <= n; f++) if (n % f === 0) { prime = false; break; }
      if (prime) { if (c < 8) H[c] = frac(Math.pow(n, 1 / 2)); K[c++] = frac(Math.pow(n, 1 / 3)); }
      n++;
    }
    const bytes = [...new TextEncoder().encode(str)], bitLen = bytes.length * 8;
    bytes.push(0x80);
    while (bytes.length % 64 !== 56) bytes.push(0);
    for (let i = 7; i >= 0; i--) bytes.push(i > 3 ? 0 : (bitLen >>> (i * 8)) & 255);
    const rotr = (x, r) => (x >>> r) | (x << (32 - r));
    for (let i = 0; i < bytes.length; i += 64) {
      const w = [];
      for (let j = 0; j < 16; j++) w[j] = (bytes[i + j * 4] << 24) | (bytes[i + j * 4 + 1] << 16) | (bytes[i + j * 4 + 2] << 8) | bytes[i + j * 4 + 3];
      for (let j = 16; j < 64; j++) {
        const s0 = rotr(w[j - 15], 7) ^ rotr(w[j - 15], 18) ^ (w[j - 15] >>> 3);
        const s1 = rotr(w[j - 2], 17) ^ rotr(w[j - 2], 19) ^ (w[j - 2] >>> 10);
        w[j] = (w[j - 16] + s0 + w[j - 7] + s1) | 0;
      }
      let [a, b, cc, d, e, f, g, h] = H;
      for (let j = 0; j < 64; j++) {
        const t1 = (h + (rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25)) + ((e & f) ^ (~e & g)) + K[j] + w[j]) | 0;
        const t2 = ((rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22)) + ((a & b) ^ (a & cc) ^ (b & cc))) | 0;
        h = g; g = f; f = e; e = (d + t1) | 0; d = cc; cc = b; b = a; a = (t1 + t2) | 0;
      }
      [a, b, cc, d, e, f, g, h].forEach((v, k) => (H[k] = (H[k] + v) | 0));
    }
    return H.map((v) => (v >>> 0).toString(16).padStart(8, "0")).join("");
  }
  const hashPassword = (pw) => sha256((ADM.salt || "") + pw);
  U.sha256 = sha256; // 회원가입 비밀번호 해시에도 사용 (participate.js)

  /* ---------- 공통 도우미 ---------- */
  const clone = (o) => JSON.parse(JSON.stringify(o));
  const stamp = () => { const t = new Date(); return `${U.ymd(t)}_${U.pad(t.getHours())}${U.pad(t.getMinutes())}`; };
  function download(filename, text, type) {
    const blob = new Blob([text], { type });
    const a = document.createElement("a");

  }

    const text = "﻿" + [headers, ...rows].map((r) => r.map(cell).join(",")).join("\r\n");

  const cellClass = (v) => ({ "출석": ' class="c-ok"', "지각": ' class="c-late"', "결석": ' class="c-no"', "미제출": ' class="c-no"' }[v] || "");

  /* =========================================================

  let password = session.get("admin.pw");
  let fails = 0, lockedUntil = 0;

  // quiz.js 에서 진행자 확인에 사용
  U.adminPassword = () => password;

  /* ---------- 화면별 동작 ---------- */
  const BIND = {
    dash(body) {
      body.querySelectorAll("[data-go]").forEach((b) => b.addEventListener("click", () => showTab(b.dataset.go)));
    },

    edit(body) {
      body.querySelector("#edKey").addEventListener("change", (e) => { BIND._editKey = e.target.value; showTab("edit"); });
      const editor = body.querySelector("#editor");
      const markDirty = () => { dirty = true; body.querySelector("#dirtyFlag").hidden = false; };
      editor.addEventListener("input", (e) => {
        const el = e.target; if (!el.dataset.path) return;
        const path = JSON.parse(el.dataset.path);
        const v = el.type === "checkbox" ? el.checked : el.type === "number" ? Number(el.value) : el.value;
        setPath(draft, path, v); markDirty();
      });
      editor.addEventListener("click", (e) => {
        const b = e.target.closest("[data-op]"); if (!b) return;
        const path = JSON.parse(b.dataset.path), op = b.dataset.op;
        if (op === "add") {
          const arr = getPath(draft, path);
          arr.push(arr.length ? blank(arr[arr.length - 1]) : "");
        } else {
          const idx = path.pop(), arr = getPath(draft, path);
          if (op === "del") { if (!confirm("이 항목을 삭제할까요?")) return; arr.splice(idx, 1); }
          if (op === "up" && idx > 0) [arr[idx - 1], arr[idx]] = [arr[idx], arr[idx - 1]];
          if (op === "down" && idx < arr.length - 1) [arr[idx + 1], arr[idx]] = [arr[idx], arr[idx + 1]];
        }
        markDirty();
        const y = $("#admBody").scrollTop; showTab("edit"); $("#admBody").scrollTop = y;
      });
      body.querySelector("#edApply").addEventListener("click", () => applyDraft());
      body.querySelector("#edDiscard").addEventListener("click", () => {
        if (dirty && !confirm("편집한 내용을 버릴까요?")) return;
        draft = clone(C); dirty = false; showTab("edit");
      });
    },

    roster(body) {
      const tbody = body.querySelector("#rsBody"), msg = body.querySelector("#rsMsg");
      const collect = () => [...tbody.querySelectorAll("tr")].map((tr) => {
        const [id, name, code] = [...tr.querySelectorAll("input")].map((i) => i.value.trim());
        return { studentId: id, name, code };
      }).filter((s) => s.studentId || s.name);
      body.querySelector("#rsAdd").addEventListener("click", () => {
        tbody.insertAdjacentHTML("beforeend", rosterRow({ studentId: "", name: "", code: "" }));
        tbody.lastElementChild.querySelector("input").focus();
      });
      tbody.addEventListener("click", (e) => { if (e.target.closest("[data-rm]")) e.target.closest("tr").remove(); });
      body.querySelector("#rsBulkAdd").addEventListener("click", () => {
        const lines = body.querySelector("#rsBulk").value.split(/\r?\n/).map((l) => l.trim()).filter(Boolean);
        let added = 0;
        lines.forEach((l) => {
          const [id, name = "", code = ""] = l.split(/\t|,/).map((x) => x.trim());
          if (!/^\d+$/.test(id)) return; // 머리글 줄 등은 건너뜀
          tbody.insertAdjacentHTML("beforeend", rosterRow({ studentId: id, name, code })); added++;
        });
        body.querySelector("#rsBulk").value = "";
        msg.className = "form-msg"; msg.textContent = `${added}명을 추가했습니다. ‘명단 저장’을 눌러야 저장됩니다.`;
      });
      body.querySelector("#rsSave").addEventListener("click", async () => {
        const list = collect();
        const ids = list.map((s) => s.studentId);
        const dup = ids.find((id, i) => ids.indexOf(id) !== i);
        const bad = list.find((s) => !s.studentId || !s.name);
        msg.className = "form-msg error";
        if (bad) { msg.textContent = "학번과 이름이 모두 있어야 합니다."; return; }
        if (dup) { msg.textContent = `학번 ${dup} 이(가) 중복되었습니다.`; return; }
        list.forEach((s) => { if (!s.code) s.code = String(1000 + Math.floor(Math.random() * 9000)); });
        msg.className = "form-msg"; msg.textContent = "저장하는 중…";
        try {
          await adminApi("saveStudents", { students: list });
          data.students = list; showTab("roster");
          const m = $("#rsMsg"); m.className = "form-msg success"; m.textContent = `${list.length}명의 명단을 저장했습니다.`;
        } catch (err) { msg.className = "form-msg error"; msg.textContent = err.message; }
      });
      body.querySelector("#rsCsv").addEventListener("click", () =>
        downloadCSV("수강생명단", ["학번", "이름", "접속코드"], collect().map((s) => [s.studentId, s.name, s.code])));
    },

    notice(body) {
      body.querySelector("#ntForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const title = body.querySelector("#ntTitle").value.trim(), msg = body.querySelector("#ntMsg");
        if (!title) { msg.className = "form-msg error"; msg.textContent = "제목을 입력해 주세요."; body.querySelector("#ntTitle").focus(); return; }
        const notice = { id: "n" + Date.now().toString(36), date: todayKey, title,
          body: body.querySelector("#ntBody").value.trim(), pinned: body.querySelector("#ntPin").checked };
        try {
          await adminApi("postNotice", { notice });
          (data.notices ||= []).push(notice); U.loadNotices(); showTab("notice");
        } catch (err) { msg.className = "form-msg error"; msg.textContent = err.message; }
      });
      body.querySelectorAll("[data-del]").forEach((b) => b.addEventListener("click", async () => {
        if (!confirm("이 공지를 삭제할까요?")) return;
        try {
          await adminApi("deleteNotice", { id: b.dataset.del });
          data.notices = data.notices.filter((n) => n.id !== b.dataset.del); U.loadNotices(); showTab("notice");
        } catch (err) { alert(err.message); }
      }));
    },

    attend(body) {
      body.querySelector("#atCsv").addEventListener("click", () => { const m = attendanceMatrix(); downloadCSV("출석부", m.headers, m.rows); });
      body.querySelector("#atRaw").addEventListener("click", () => downloadCSV("출석기록", ["날짜", "시각", "학번", "이름", "상태"],
        data.attendance.map((a) => [a.date, a.time, a.studentId, a.name, a.status])));
    },

    hw(body) {
      body.querySelector("#hwCsv").addEventListener("click", () => { const m = submissionMatrix(); downloadCSV("과제제출현황", m.headers, m.rows); });
      body.querySelector("#hwRaw").addEventListener("click", () => downloadCSV("과제제출기록", ["제출 시각", "학번", "이름", "과제", "파일명", "파일 링크"],
        data.submissions.map((s) => [s.at, s.studentId, s.name, s.assignment, s.fileName, s.url || ""])));
    },

    apply(body) {
      body.querySelector("#apCsv").addEventListener("click", () => { const t = applicationTable(); downloadCSV("수강신청", t.headers, t.rows); });
      body.querySelector("#apToRoster").addEventListener("click", async () => {
        const msg = body.querySelector("#apMsg");
        const have = new Set(data.students.map((s) => String(s.studentId)));
        const add = data.applications.filter((a) => a.studentId && !have.has(String(a.studentId)))
          .map((a) => ({ studentId: String(a.studentId), name: a.name || "", code: String(1000 + Math.floor(Math.random() * 9000)) }));
        if (!add.length) { msg.className = "form-msg"; msg.textContent = "새로 추가할 가입자가 없습니다."; return; }
        if (!confirm(`가입자 ${add.length}명을 수강생 명단에 추가할까요? (접속코드 자동 생성)`)) return;
        try {
          const list = [...data.students, ...add];
          await adminApi("saveStudents", { students: list });
          data.students = list;
          msg.className = "form-msg success"; msg.textContent = `${add.length}명을 명단에 추가했습니다. ‘수강생 명단’ 탭에서 접속코드를 확인하세요.`;
        } catch (err) { msg.className = "form-msg error"; msg.textContent = err.message; }
      });
    },

    file(body) {
      body.querySelector("#fExport").addEventListener("click", () => exportSite(draft));
      body.querySelector("#fExportJson").addEventListener("click", () =>
        download(`config-backup_${stamp()}.json`, JSON.stringify(draft, null, 2), "application/json"));
      body.querySelector("#fImport").addEventListener("change", async (e) => {
        const file = e.target.files[0], msg = body.querySelector("#fMsg");
        if (!file) return;
        try {
          let cfg;
          try { cfg = parseConfigFile(await file.text()); } catch { cfg = null; }
          if (!cfg || !cfg.site || !cfg.nav) throw new Error("이 사이트의 설정 파일(index.html, config.js 또는 JSON 백업)이 아닙니다.");
          draft = cfg; dirty = true;
          msg.className = "form-msg success";
          msg.innerHTML = `불러왔습니다. <button class="chip" id="fApplyNow">바로 미리보기 적용</button> 또는 ‘사이트 편집’ 탭에서 확인하세요.`;
          body.querySelector("#fApplyNow").addEventListener("click", () => applyDraft());
        } catch (err) { msg.className = "form-msg error"; msg.textContent = `불러오지 못했습니다: ${err.message}`; }
      });
      body.querySelector("#fReset").addEventListener("click", () => {
        if (!confirm("미리보기를 지우고 원래 설정으로 돌아갈까요?")) return;
        try { localStorage.removeItem("siteConfig.draft"); } catch { /* */ }
        session.set("admin.reopen", "file"); location.reload();
      });
      body.querySelector("#pwMake").addEventListener("click", async () => {
        const a = body.querySelector("#pwNew").value, b = body.querySelector("#pwNew2").value, out = body.querySelector("#pwOut");
        if (a.length < 8) { out.innerHTML = `<p class="form-msg error">8자 이상으로 정해 주세요.</p>`; return; }
        if (a !== b) { out.innerHTML = `<p class="form-msg error">두 비밀번호가 다릅니다.</p>`; return; }
        const hash = await hashPassword(a);
        draft.admin = { ...(draft.admin || {}), salt: ADM.salt, passwordHash: hash };
        dirty = true;
        out.innerHTML = `
          <p class="small">새 해시값 (편집 내용에도 반영됨):</p>
          <code class="hash">${hash}</code>
          <p class="muted small">① ‘${CFG_FILE} 내려받기’로 저장해 사이트에 올리고 ② 서버를 쓰는 경우 Code.gs 의 ADMIN_HASH 도 이 값으로 바꾼 뒤 새 버전으로 배포하세요.</p>`;
      });
    }
  };

  /* ---------- 수강 신청 표 ---------- */
  function applicationTable() {
    const labels = Object.fromEntries(((C.participate && C.participate.form.fields) || []).map((f) => [f.name, f.label.replace(/\(.*\)|에 동의합니다\./g, "")]));
    const keys = [];
    data.applications.forEach((a) => Object.keys(a).forEach((k) => { if (!keys.includes(k)) keys.push(k); }));
    return { headers: keys.map((k) => labels[k] || k), rows: data.applications.map((a) => keys.map((k) => a[k] ?? "")) };
  }

      <td><input value="${esc(s.name)}" aria-label="이름"></td>
      <td><input value="${esc(s.code)}" aria-label="접속코드"></td>
      <td><button class="chip danger" data-rm aria-label="삭제">삭제</button></td>

  const getPath = (o, path) => path.reduce((x, k) => x[k], o);

  const blank = (v) => Array.isArray(v) ? [] : v && typeof v === "object"

      if (!sc) return null;

    const sandbox = {};

<script data-bundle>
// 실시간 퀴즈 (Kahoot · Socrative 방식)
// - 진행자(관리자): 문제 만들기(직접 / AI) → 퀴즈 열기 → QR·PIN 표시 → 문제 진행 → 결과 CSV
// - 학생: QR 촬영 또는 PIN 입력 → 이름 입력 → 휴대폰으로 답하기
// 내용(예시 퀴즈, 제한 시간 등)은 config.js 의 quiz 에서 고치세요.

/* ==ENGINE START== 퀴즈 진행 규칙. backend/Code.gs 에도 똑같이 들어 있습니다. */
function QuizEngine(store) {
  const TTL = 21600;             // 6시간 보관
  const READY_MS = 3000;         // 문제 공개 후 답을 받기 전 준비 시간
  const now = () => Date.now();
  const key = (pin) => "quiz:" + pin;
  const ansKey = (pin, qi, pid) => "qa:" + pin + ":" + qi + ":" + pid;
  const load = (pin) => {
    const s = store.get(key(String(pin)));
    if (!s) throw new Error("퀴즈를 찾을 수 없습니다. PIN 을 확인하세요.");
    return s;
  };
  const save = (s) => store.put(key(s.pin), s, TTL);

  function ranking(s) {
    return Object.keys(s.players)
      .map((id) => ({ id: id, name: s.players[id].name, sid: s.players[id].sid, score: s.players[id].score }))
      .sort((a, b) => b.score - a.score || a.name.localeCompare(b.name))
      .map((p, i) => Object.assign(p, { rank: i + 1 }));
  }

  function create(quiz) {
    const qs = (quiz.questions || []).map((q) => ({
      question: String(q.question || "").trim(),
      choices: (q.choices || []).map((c) => String(c || "").trim()),
      answer: Number(q.answer) || 0,
      time: Math.min(120, Math.max(5, Number(q.time) || 20)),
      explanation: String(q.explanation || "")
    })).filter((q) => q.question && q.choices.filter(Boolean).length >= 2 && q.choices[q.answer]);
    if (!qs.length) throw new Error("진행할 수 있는 문제가 없습니다. 문제·선택지·정답을 확인하세요.");
    let pin;
    do { pin = String(100000 + Math.floor(Math.random() * 900000)); } while (store.get(key(pin)));
    save({ pin: pin, title: String(quiz.title || "퀴즈"), questions: qs, phase: "lobby", qi: -1,
      qStart: 0, qEnd: 0, players: {}, results: {}, createdAt: now() });
    return { pin: pin };
  }

  function join(pin, name, sid) {
    const s = load(pin);
    if (s.phase === "ended") throw new Error("이미 끝난 퀴즈입니다.");
    const base = String(name || "").trim().slice(0, 20);
    if (!base) throw new Error("이름을 입력하세요.");
    const ids = Object.keys(s.players);
    if (ids.length >= 300) throw new Error("참가 인원이 가득 찼습니다.");
    let finalName = base, n = 2;
    while (ids.some((id) => s.players[id].name === finalName)) finalName = base + " (" + (n++) + ")";
    const pid = "p" + now().toString(36) + Math.random().toString(36).slice(2, 7);
    s.players[pid] = { name: finalName, sid: String(sid || "").trim().slice(0, 20), score: 0, joinedAt: now() };
    save(s);
    return { pid: pid, name: finalName };
  }

  function answersOf(s) {
    const ids = Object.keys(s.players);
    const got = ids.length ? store.getMany(ids.map((id) => ansKey(s.pin, s.qi, id))) : {};
    const out = {};
    ids.forEach((id) => { const a = got[ansKey(s.pin, s.qi, id)]; if (a) out[id] = a; });
    return out;
  }

  function answer(pin, pid, qi, choice) {
    const s = load(pin);
    if (!s.players[pid]) throw new Error("참가자 정보가 없습니다. 다시 입장하세요.");
    if (s.phase !== "question" || s.qi !== Number(qi)) throw new Error("지금은 답할 수 없습니다.");
    const t = now();
    if (t < s.qStart) throw new Error("아직 답할 수 없습니다.");
    if (t > s.qEnd + 1500) throw new Error("시간이 끝났습니다.");
    const k = ansKey(s.pin, s.qi, pid);
    if (store.get(k)) throw new Error("이미 답했습니다.");
    store.put(k, { c: Number(choice), at: t }, TTL);
    return { ok: true };
  }

  function reveal(s) {
    const q = s.questions[s.qi], got = answersOf(s), res = {};
    Object.keys(s.players).forEach((id) => {
      const a = got[id];
      if (!a) { res[id] = { c: -1, ms: null, ok: false, pts: 0 }; return; }
      const ms = Math.max(0, a.at - s.qStart), ok = a.c === q.answer;
      // 맞히면 500~1000점: 빨리 맞힐수록 높음
      const pts = ok ? Math.round(1000 - 500 * Math.min(1, ms / (q.time * 1000))) : 0;
      s.players[id].score += pts;
      res[id] = { c: a.c, ms: ms, ok: ok, pts: pts };
    });
    s.results[s.qi] = res;
    s.phase = "reveal";
  }

  function host(pin, op) {
    const s = load(pin);
    if (op === "next") {
      if (s.phase === "question") reveal(s);
      if (s.qi + 1 >= s.questions.length) s.phase = "ended";
      else {
        s.qi++;
        s.phase = "question";
        s.qStart = now() + READY_MS;
        s.qEnd = s.qStart + s.questions[s.qi].time * 1000;
      }
    } else if (op === "reveal") {
      if (s.phase === "question") reveal(s);
    } else if (op === "leaderboard") {
      if (s.phase === "question") reveal(s);
      s.phase = "leaderboard";
    } else if (op === "end") {
      if (s.phase === "question") reveal(s);
      s.phase = "ended";
    } else throw new Error("알 수 없는 진행 명령입니다.");
    save(s);
    return hostStatus(pin);
  }

  function hostStatus(pin) {
    const s = load(pin);
    const answered = s.phase === "question" ? Object.keys(answersOf(s)).length : null;
    return { state: s, answered: answered, ranking: ranking(s), serverNow: now() };
  }

  function playerStatus(pin, pid) {
    const s = load(pin), p = s.players[pid];
    if (!p) throw new Error("참가자 정보가 없습니다. 다시 입장하세요.");
    const q = s.qi >= 0 ? s.questions[s.qi] : null;
    const out = { title: s.title, phase: s.phase, qi: s.qi, total: s.questions.length,
      players: Object.keys(s.players).length, name: p.name, score: p.score, serverNow: now() };
    if (q && (s.phase === "question" || s.phase === "reveal")) {
      out.q = { question: q.question, choices: q.choices, time: q.time, qStart: s.qStart, qEnd: s.qEnd };
    }
    if (s.phase === "question") out.answered = !!store.get(ansKey(s.pin, s.qi, pid));
    if (q && s.phase !== "question" && s.phase !== "lobby") {
      out.correct = q.answer;
      out.correctText = q.choices[q.answer];
      out.explanation = q.explanation;
      out.mine = (s.results[s.qi] || {})[pid] || null;
    }
    if (s.phase !== "lobby" && s.phase !== "question") {
      const r = ranking(s);
      const me = r.find((x) => x.id === pid);
      out.rank = me ? me.rank : null;
      out.top = r.slice(0, 5).map((x) => ({ name: x.name, score: x.score, rank: x.rank }));
    }
    return out;
  }

  return { create: create, join: join, answer: answer, host: host, hostStatus: hostStatus, playerStatus: playerStatus };
}
/* ==ENGINE END== */

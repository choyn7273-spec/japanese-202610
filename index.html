      if (pin.length !== 6) { m.textContent = "PIN 6자리를 입력하세요."; $("#qzPin").focus(); return; }
      if (!name) { m.textContent = "이름을 입력하세요."; $("#qzName").focus(); return; }
      const btn = f.querySelector("button"); btn.disabled = true; m.textContent = "";
      try {
        const r = await qapi("join", { pin, name, sid: $("#qzSid").value.trim() });
        me = { pin, pid: r.pid, name: r.name };
        session.set("quiz.player", me);
        startPlayer();
      } catch (err) { m.textContent = err.message; btn.disabled = false; }
    });
  }

  function startPlayer() {
    stopPlayer();
    pKey = "";
    const tick = async () => {
      try {
        const r = await qapi("status", { pin: me.pin, pid: me.pid });
        syncClock(r); pState = r; renderPlayer();
      } catch (err) {
        if (/찾을 수 없|참가자 정보/.test(err.message)) { leave(err.message); }
      }
    };
    tick();
    pPoll = setInterval(tick, POLL);
    pTimer = setInterval(updatePlayerTimer, 200);
  }
  function stopPlayer() { clearInterval(pPoll); clearInterval(pTimer); pPoll = pTimer = null; }
  function leave(msg) { me = null; session.set("quiz.player", null); renderJoin(msg || ""); }

  function updatePlayerTimer() {
    const el = $("#qzPTimer");
    if (!el || !pState || !pState.q) return;
    const t = serverNow();
    if (t < pState.q.qStart) { el.textContent = Math.ceil((pState.q.qStart - t) / 1000); el.dataset.ready = "1"; return; }
    el.dataset.ready = "";
    el.textContent = Math.max(0, Math.ceil((pState.q.qEnd - t) / 1000));
    if (pState.phase === "question" && t >= pState.q.qStart && play.querySelector(".qz-ready")) renderPlayer(true);
  }

  function renderPlayer(force) {
    const s = pState; if (!s) return;
    const ready = s.phase === "question" && s.q && serverNow() < s.q.qStart;
    const k = [s.phase, s.qi, s.answered, ready, s.players].join("|");
    if (k === pKey && !force) return;
    pKey = k;
    const head = `
      <div class="qz-p-head">
        <span class="qz-me">👤 ${esc(s.name)}</span>
        <span class="qz-score">${s.score.toLocaleString()}점</span>
        <button class="chip" id="qzLeave">나가기</button>
      </div>`;
    let body = "";
    if (s.phase === "lobby") {
      body = `<div class="qz-wait"><div class="qz-spinner"></div><h3>입장 완료!</h3>
        <p><b>${esc(s.title)}</b></p><p class="muted">진행자가 시작하면 문제가 나타납니다 · 현재 ${s.players}명</p></div>`;
    } else if (s.phase === "question" && ready) {
      body = `<div class="qz-ready"><p class="muted">문제 ${s.qi + 1} / ${s.total}</p><div class="qz-timer big" id="qzPTimer">3</div>
        <h3>${esc(s.q.question)}</h3><p class="muted">준비하세요!</p></div>`;
    } else if (s.phase === "question" && s.answered) {
      body = `<div class="qz-wait"><div class="qz-spinner"></div><h3>답을 제출했어요!</h3>
        <p class="muted">다른 친구들을 기다리는 중… <span class="qz-timer inline" id="qzPTimer"></span>초</p></div>`;
    } else if (s.phase === "question") {
      body = `
        <div class="qz-p-q">
          <div class="qz-p-top"><span>문제 ${s.qi + 1} / ${s.total}</span><span class="qz-timer" id="qzPTimer"></span></div>
          <h3 class="qz-p-question">${esc(s.q.question)}</h3>
          <div class="qz-p-choices${s.q.choices.filter(Boolean).length === 2 ? " two" : ""}">${s.q.choices.map((c, i) => c ? `
            <button class="qz-choice ${COLORS[i]}" data-choice="${i}"><span class="shape">${SHAPES[i]}</span><span>${esc(c)}</span></button>` : "").join("")}</div>
          <p class="form-msg error" id="qzAnsMsg" role="alert"></p>
        </div>`;
    } else if (s.phase === "reveal" || s.phase === "leaderboard") {
      const m = s.mine || { c: -1, ok: false, pts: 0 };
      body = `
        <div class="qz-result ${m.ok ? "ok" : "no"}">
          <div class="qz-result-icon">${m.ok ? "✓" : m.c < 0 ? "⏱" : "✕"}</div>
          <h3>${m.ok ? "정답!" : m.c < 0 ? "시간 초과" : "아쉬워요"}</h3>
          ${m.ok ? `<p class="qz-pts">+${m.pts.toLocaleString()}점</p>` : `<p>정답: <b>${esc(s.correctText)}</b></p>`}
          ${s.explanation ? `<p class="muted small">${esc(s.explanation)}</p>` : ""}
          <p class="qz-rank">현재 <b>${s.rank}</b>위 / ${s.players}명</p>
        </div>`;
    } else if (s.phase === "ended") {
      const medal = ["🥇", "🥈", "🥉"][s.rank - 1] || "🎉";
      body = `
        <div class="qz-final">
          <div class="qz-medal">${medal}</div>
          <h3>최종 ${s.rank}위</h3>
          <p class="qz-pts">${s.score.toLocaleString()}점</p>
          <ol class="qz-mini-board">${(s.top || []).map((p) => `<li${p.name === s.name ? ' class="me"' : ""}><span>${p.rank}. ${esc(p.name)}</span><b>${p.score.toLocaleString()}</b></li>`).join("")}</ol>
          <button class="btn wide-btn" id="qzAgain">다른 퀴즈 입장</button>
        </div>`;
      if (s.rank && s.rank <= 3 && !U.reduceMotion && !play.dataset.celebrated) { play.dataset.celebrated = me.pin; U.confetti(); }
    }
    play.innerHTML = head + body;
    updatePlayerTimer();
    $("#qzLeave").addEventListener("click", () => { if (confirm("퀴즈에서 나갈까요?")) leave(); });
    const again = $("#qzAgain"); if (again) again.addEventListener("click", () => leave());
    play.querySelectorAll("[data-choice]").forEach((b) => b.addEventListener("click", async () => {
      play.querySelectorAll("[data-choice]").forEach((x) => (x.disabled = true));
      b.classList.add("picked");
      try {
        await qapi("answer", { pin: me.pin, pid: me.pid, qi: s.qi, choice: Number(b.dataset.choice) });
        pState.answered = true; renderPlayer();
      } catch (err) {
        $("#qzAnsMsg").textContent = err.message;
        if (!/이미|끝났/.test(err.message)) play.querySelectorAll("[data-choice]").forEach((x) => (x.disabled = false));
      }
    }));
  }

  if (me) startPlayer(); else renderJoin();
  if (urlPin) setTimeout(() => {
    section.scrollIntoView({ behavior: "auto", block: "start" });
    const n = $("#qzName"); if (n && !n.value) n.focus({ preventScroll: true });
  }, 300);

  /* =========================================================
   * 진행자 화면
   * ========================================================= */
  const SETS_KEY = "quiz.sets";
  let sets = local.get(SETS_KEY, null);
  if (!sets || !sets.length) sets = [{ id: "s" + Date.now(), ...JSON.parse(JSON.stringify(QC.sample || { title: "새 퀴즈", questions: [] })) }];
  let curId = local.get("quiz.current", sets[0].id);
  const cur = () => sets.find((x) => x.id === curId) || sets[0];
  const saveSets = () => { local.set(SETS_KEY, sets); local.set("quiz.current", curId); };

  let hostEl = null, hostPin = session.get("quiz.hostPin"), hState = null, hPoll = null, hTimer = null, hKey = "", revealing = -1;

  $("#qzHostBtn").addEventListener("click", async () => {
    if (!(U.adminPassword && U.adminPassword())) {
      const pw = prompt("관리자 비밀번호를 입력하세요.");
      if (pw == null) return;
      if (!(await U.verifyAdmin(pw))) { alert("비밀번호가 맞지 않습니다."); return; }
    }
    openHost();
  });

  function openHost() {
    if (!hostEl) {
      hostEl = document.createElement("div");
      hostEl.className = "qz-host";
      hostEl.setAttribute("role", "dialog");
      hostEl.setAttribute("aria-modal", "true");
      hostEl.setAttribute("aria-label", "퀴즈 진행자 화면");
      hostEl.innerHTML = `
        <header class="qz-host-head">
          <strong>🎯 실시간 퀴즈 · 진행자</strong>
          ${DEMO ? `<span class="badge off">데모 모드</span>` : ""}
          <span class="spacer"></span>
          <button class="chip" id="qzFull">전체 화면</button>
          <button class="modal-x" id="qzClose" aria-label="진행자 화면 닫기">×</button>
        </header>
        <div class="qz-host-body" id="qzHostBody"></div>`;
      document.body.appendChild(hostEl);
      $("#qzClose").addEventListener("click", closeHost);
      $("#qzFull").addEventListener("click", () => {
        if (document.fullscreenElement) document.exitFullscreen();
        else if (hostEl.requestFullscreen) hostEl.requestFullscreen().catch(() => {});
      });
    }
    document.body.classList.add("admin-open");
    hostEl.classList.add("show");
    if (hostPin) startHostLoop(); else renderSetup();
  }
  function closeHost() {
    if (hState && hState.state.phase !== "ended" && hState.state.phase !== "lobby" &&
        !confirm("퀴즈가 진행 중입니다. 화면을 닫아도 퀴즈는 계속되며, 다시 열면 이어서 진행합니다.")) return;
    stopHostLoop();
    hostEl.classList.remove("show");
    document.body.classList.remove("admin-open");
    if (document.fullscreenElement) document.exitFullscreen();
  }

  /* ---------- 1. 문제 만들기 ---------- */
  function renderSetup(msg) {
    stopHostLoop();
    const set = cur();
    const body = $("#qzHostBody");
    body.innerHTML = `
      <div class="qz-setup">
        <aside class="qz-sets">
          <h3>퀴즈 목록</h3>
          <ul>${sets.map((s) => `<li><button class="${s.id === set.id ? "on" : ""}" data-set="${s.id}">${esc(s.title || "제목 없음")}<small>${s.questions.length}문항</small></button></li>`).join("")}</ul>
          <button class="chip" id="qzNewSet">+ 새 퀴즈</button>
          <label class="chip file-chip">JSON 가져오기<input type="file" id="qzImport" accept=".json,application/json" hidden></label>
        </aside>
        <div class="qz-edit">
          <div class="qz-edit-head">
            <input id="qzTitle" value="${esc(set.title)}" aria-label="퀴즈 제목" placeholder="퀴즈 제목">
            <button class="btn" id="qzExport">JSON 내보내기</button>
            <button class="btn" id="qzDelSet">삭제</button>
            <button class="btn primary" id="qzStart">▶ 퀴즈 열기</button>
          </div>
          ${msg ? `<p class="form-msg error">${esc(msg)}</p>` : ""}
          <details class="qz-ai" ${set.questions.length ? "" : "open"}>
            <summary>✨ AI로 문제 만들기</summary>
            <div class="qz-ai-grid">
              <div class="field wide"><label for="aiTopic">주제 / 범위</label>
                <input id="aiTopic" placeholder="예: 4주차 말하기 지도 – 롤플레이와 인포메이션 갭"></div>
              <div class="field"><label for="aiLevel">난이도</label>
                <select id="aiLevel"><option>기초</option><option selected>보통</option><option>심화</option></select></div>
              <div class="field"><label for="aiCount">문항 수</label>
                <input id="aiCount" type="number" min="1" max="20" value="5"></div>
              <div class="field"><label for="aiType">형식</label>
                <select id="aiType"><option value="mc">4지선다</option><option value="ox">O·X</option><option value="mix">섞어서</option></select></div>
              <div class="field"><label for="aiTime">문항당 시간</label>
                <select id="aiTime">${[10, 15, 20, 30, 45, 60].map((t) => `<option value="${t}"${t === (QC.defaultTime || 20) ? " selected" : ""}>${t}초</option>`).join("")}</select></div>
              <div class="field wide"><label for="aiMaterial">참고 자료 <small class="muted">(선택 · 강의 자료 내용을 붙여 넣으면 그 내용으로 출제)</small></label>
                <textarea id="aiMaterial" rows="3"></textarea></div>
            </div>
            <div class="qz-ai-actions">
              <button class="btn primary" id="aiGen"${DEMO ? " disabled" : ""}>AI로 바로 만들기</button>
              <button class="btn" id="aiCopy">프롬프트 복사</button>
              <span class="muted small">${DEMO ? "데모 모드: ‘프롬프트 복사’ → ChatGPT·Claude 등에 붙여 넣고 → 답변을 아래에 붙여 넣으세요." : "서버에 API 키가 없으면 ‘프롬프트 복사’ 방식을 쓰세요."}</span>
            </div>
            <div class="field"><label for="aiPaste">AI 답변 붙여넣기</label>
              <textarea id="aiPaste" rows="3" placeholder='{"questions":[{"question":"...","choices":["...","...","...","..."],"answer":0,"explanation":"..."}]}'></textarea></div>
            <button class="btn" id="aiAdd">붙여 넣은 문제 추가</button>
            <p class="form-msg" id="aiMsg" role="status"></p>
          </details>
          <div id="qzQList" class="qz-qlist">${set.questions.map(questionCard).join("") || `<p class="muted empty">아직 문제가 없습니다. AI로 만들거나 아래에서 추가하세요.</p>`}</div>
          <button class="chip" id="qzAddQ">+ 문제 추가</button>
        </div>
      </div>`;
    bindSetup(body);
  }

  const questionCard = (q, i) => `
    <div class="qz-qcard" data-i="${i}">
      <div class="qz-qcard-head">
        <b>Q${i + 1}</b>
        <select data-f="time" aria-label="제한 시간">${[5, 10, 15, 20, 30, 45, 60, 90, 120].map((t) => `<option value="${t}"${t === Number(q.time || QC.defaultTime || 20) ? " selected" : ""}>${t}초</option>`).join("")}</select>
        <span class="spacer"></span>
        <button class="ed-mini" data-op="up" aria-label="위로">↑</button>
        <button class="ed-mini" data-op="down" aria-label="아래로">↓</button>
        <button class="ed-mini danger" data-op="del" aria-label="삭제">✕</button>
      </div>
      <textarea data-f="question" rows="2" placeholder="문제" aria-label="문제">${esc(q.question)}</textarea>
      <div class="qz-qchoices">${[0, 1, 2, 3].map((k) => `
        <label class="qz-qchoice ${COLORS[k]}">
          <input type="radio" name="ans${i}" data-f="answer" value="${k}"${Number(q.answer) === k ? " checked" : ""} aria-label="정답으로 선택">
          <span class="shape">${SHAPES[k]}</span>
          <input data-f="choice" data-k="${k}" value="${esc((q.choices || [])[k] || "")}" placeholder="${k < 2 ? "선택지" : "선택지(비워 두면 안 보임)"}">
        </label>`).join("")}</div>
      <input data-f="explanation" value="${esc(q.explanation || "")}" placeholder="해설 (선택 · 정답 공개 때 표시)" aria-label="해설">
    </div>`;

  function bindSetup(body) {
    const set = cur();
    body.querySelectorAll("[data-set]").forEach((b) => b.addEventListener("click", () => { curId = b.dataset.set; saveSets(); renderSetup(); }));
    $("#qzNewSet").addEventListener("click", () => {
      const s = { id: "s" + Date.now(), title: "새 퀴즈", questions: [] };
      sets.push(s); curId = s.id; saveSets(); renderSetup();
    });
    $("#qzImport").addEventListener("change", async (e) => {
      const f = e.target.files[0]; if (!f) return;
      try {
        const text = await f.text();
        const qs = parseQuestions(text);
        let title = "";
        try { title = JSON.parse(text).title || ""; } catch { /* 제목 없음 */ }
        const s = { id: "s" + Date.now(), title: title || f.name.replace(/\.json$/i, ""), questions: qs };
        sets.push(s); curId = s.id; saveSets(); renderSetup();
      } catch (err) { renderSetup("가져오지 못했습니다: " + err.message); }
    });
    $("#qzTitle").addEventListener("input", (e) => { set.title = e.target.value; saveSets(); });
    $("#qzExport").addEventListener("click", () => downloadFile(`퀴즈_${safeName(set.title)}.json`,
      JSON.stringify({ title: set.title, questions: set.questions }, null, 2), "application/json"));
    $("#qzDelSet").addEventListener("click", () => {
      if (!confirm(`‘${set.title}’ 퀴즈를 삭제할까요?`)) return;
      sets = sets.filter((s) => s.id !== set.id);
      if (!sets.length) sets.push({ id: "s" + Date.now(), title: "새 퀴즈", questions: [] });
      curId = sets[0].id; saveSets(); renderSetup();
    });
    $("#qzAddQ").addEventListener("click", () => {
      set.questions.push({ question: "", choices: ["", "", "", ""], answer: 0, time: QC.defaultTime || 20, explanation: "" });
      saveSets(); renderSetup();
      const cards = $("#qzHostBody").querySelectorAll(".qz-qcard");
      cards[cards.length - 1].querySelector("textarea").focus();
    });
    const list = $("#qzQList");
    list.addEventListener("input", (e) => {
      const card = e.target.closest(".qz-qcard"); if (!card) return;
      const q = set.questions[Number(card.dataset.i)], f = e.target.dataset.f;
      if (f === "choice") { q.choices = q.choices || ["", "", "", ""]; q.choices[Number(e.target.dataset.k)] = e.target.value; }
      else if (f === "answer") q.answer = Number(e.target.value);
      else if (f === "time") q.time = Number(e.target.value);
      else if (f) q[f] = e.target.value;
      saveSets();
    });
    list.addEventListener("click", (e) => {
      const b = e.target.closest("[data-op]"); if (!b) return;
      const i = Number(b.closest(".qz-qcard").dataset.i), qs = set.questions;
      if (b.dataset.op === "del") { if (!confirm(`Q${i + 1}을 삭제할까요?`)) return; qs.splice(i, 1); }
      if (b.dataset.op === "up" && i > 0) [qs[i - 1], qs[i]] = [qs[i], qs[i - 1]];
      if (b.dataset.op === "down" && i < qs.length - 1) [qs[i + 1], qs[i]] = [qs[i], qs[i + 1]];
      saveSets(); renderSetup();
    });
    // AI 출제
    const aiMsg = $("#aiMsg");
    const opts = () => ({ topic: $("#aiTopic").value.trim(), level: $("#aiLevel").value, count: Math.min(20, Math.max(1, Number($("#aiCount").value) || 5)),
      type: $("#aiType").value, time: Number($("#aiTime").value), material: $("#aiMaterial").value.trim() });
    $("#aiCopy").addEventListener("click", async () => {
      const o = opts();
      if (!o.topic && !o.material) { aiMsg.className = "form-msg error"; aiMsg.textContent = "주제나 참고 자료를 입력하세요."; return; }
      const text = buildPrompt(o, true);
      try { await navigator.clipboard.writeText(text); aiMsg.className = "form-msg success"; aiMsg.textContent = "프롬프트를 복사했습니다. AI 채팅에 붙여 넣고, 받은 답변을 아래 칸에 붙여 넣으세요."; }
      catch { $("#aiPaste").value = text; aiMsg.className = "form-msg"; aiMsg.textContent = "복사가 막혀 있어 아래 칸에 프롬프트를 넣었습니다. 직접 복사해 사용하세요."; }
    });
    $("#aiAdd").addEventListener("click", () => {
      try {
        const qs = parseQuestions($("#aiPaste").value, Number($("#aiTime").value));
        set.questions.push(...qs); saveSets(); renderSetup();
        const m = $("#aiMsg"); m.className = "form-msg success"; m.textContent = `${qs.length}문항을 추가했습니다. 내용을 확인하고 필요하면 고치세요.`;
        $("#qzHostBody").querySelector(".qz-ai").open = true;
      } catch (err) { aiMsg.className = "form-msg error"; aiMsg.textContent = err.message; }
    });
    $("#aiGen").addEventListener("click", async (e) => {
      const o = opts();
      if (!o.topic && !o.material) { aiMsg.className = "form-msg error"; aiMsg.textContent = "주제나 참고 자료를 입력하세요."; return; }
      e.target.disabled = true; aiMsg.className = "form-msg"; aiMsg.textContent = "AI가 문제를 만드는 중입니다… (30초~1분)";
      try {
        const r = await qapi("ai", { prompt: buildPrompt(o, false) });
        const qs = normalize(r.questions || [], o.time);
        set.questions.push(...qs); saveSets(); renderSetup();
        const m = $("#aiMsg"); m.className = "form-msg success"; m.textContent = `AI가 ${qs.length}문항을 만들었습니다. 정답과 내용을 꼭 확인하세요.`;
        $("#qzHostBody").querySelector(".qz-ai").open = true;
      } catch (err) { aiMsg.className = "form-msg error"; aiMsg.textContent = `${err.message} — ‘프롬프트 복사’ 방식을 이용해 보세요.`; e.target.disabled = false; }
    });
    $("#qzStart").addEventListener("click", async (e) => {
      const valid = normalize(set.questions, QC.defaultTime || 20, true);
      if (!valid.length) { renderSetup("진행할 수 있는 문제가 없습니다. 문제·선택지 2개 이상·정답을 확인하세요."); return; }
      if (valid.length < set.questions.length && !confirm(`${set.questions.length - valid.length}문항은 문제나 정답 선택지가 비어 있어 빠집니다. 계속할까요?`)) return;
      e.target.disabled = true;
      try {
        const r = await qapi("create", { quiz: { title: set.title, questions: valid } });
        hostPin = r.pin; session.set("quiz.hostPin", hostPin);
        startHostLoop();
      } catch (err) { renderSetup(err.message); }
    });
  }

  function buildPrompt(o, forChat) {
    const type = { mc: "모두 4지선다", ox: "모두 O·X (choices 는 [\"O\",\"X\"])", mix: "4지선다와 O·X(choices [\"O\",\"X\"])를 섞어서" }[o.type];
    return [
      "당신은 고려대학교 일어일문학과 「일본어교과교재연구및지도법」(중등 일본어 교사 양성 과목) 강의의 퀴즈 출제자입니다.",
      "수업 중 학생들이 휴대폰으로 실시간 퀴즈를 풀 수 있도록 문제를 만들어 주세요.",
      "",
      `- 주제/범위: ${o.topic || "(참고 자료 내용)"}`,
      `- 난이도: ${o.level}`,
      `- 문항 수: ${o.count}`,
      `- 형식: ${type}`,
      "- 정답은 반드시 하나이고, 오답 선택지도 그럴듯하게 만듭니다.",
      "- 휴대폰 화면에 표시되므로 문제는 80자, 선택지는 30자 이내로 짧게 씁니다.",
      "- 일본어 예문이나 용어는 일본어로, 문제 설명과 해설은 한국어로 씁니다.",
      "- answer 는 정답 선택지의 번호(0부터 시작)입니다. 정답 위치가 한쪽으로 몰리지 않게 섞어 주세요.",
      "- explanation 에는 정답 이유를 한두 문장으로 씁니다.",
      o.material ? `\n[참고 자료 — 이 내용에 근거해 출제]\n${o.material}\n` : "",
      forChat ? 'JSON 만 출력하세요(설명·코드블록 없이). 형식: {"questions":[{"question":"...","choices":["...","...","...","..."],"answer":0,"explanation":"..."}]}' : ""
    ].join("\n");
  }

  // AI 답변이나 JSON 파일을 문제 목록으로 바꿈
  function parseQuestions(text, time) {
    let t = String(text || "").replace(/```(?:json)?/gi, "").trim();
    if (!t) throw new Error("붙여 넣은 내용이 없습니다.");
    const a = t.search(/[[{]/), b = Math.max(t.lastIndexOf("}"), t.lastIndexOf("]"));
    if (a < 0 || b < a) throw new Error("JSON 형식의 답변을 찾지 못했습니다.");
    let data;
    try { data = JSON.parse(t.slice(a, b + 1)); } catch { throw new Error("JSON 을 읽지 못했습니다. AI 답변 전체를 그대로 붙여 넣었는지 확인하세요."); }
    const list = normalize(Array.isArray(data) ? data : data.questions || [], time);
    if (!list.length) throw new Error("문제를 찾지 못했습니다.");
    return list;
  }
  function normalize(list, time, strict) {
    return list.map((q) => {
      let choices = (q.choices || q.options || []).map((c) => String(c ?? "").replace(/^[A-D①-④\d][.)]\s*/, "").trim());
      while (choices.length < 4) choices.push("");
      choices = choices.slice(0, 4);
      let ans = q.answer ?? q.correct ?? 0;
      if (typeof ans === "string") {
        const L = "ABCD".indexOf(ans.trim().toUpperCase());
        ans = L >= 0 ? L : /^\d+$/.test(ans) ? Number(ans) : Math.max(0, choices.indexOf(ans.trim()));
      }
      return { question: String(q.question || q.q || "").trim(), choices, answer: Number(ans) || 0,
        time: Number(q.time) || time || QC.defaultTime || 20, explanation: String(q.explanation || "").trim() };
    }).filter((q) => !strict || (q.question && q.choices.filter(Boolean).length >= 2 && q.choices[q.answer]));
  }

  /* ---------- 2. 진행 화면 ---------- */
  function startHostLoop() {
    stopHostLoop();
    hKey = ""; revealing = -1;
    const tick = async () => {
      try {
        const r = await qapi("hostStatus", { pin: hostPin });
        syncClock(r); hState = r; renderHost();
      } catch (err) {
        if (/찾을 수 없/.test(err.message)) { hostPin = null; session.set("quiz.hostPin", null); renderSetup("퀴즈 정보가 만료되었습니다. 다시 열어 주세요."); }
      }
    };
    tick();
    hPoll = setInterval(tick, POLL);
    hTimer = setInterval(hostTick, 200);
  }
  function stopHostLoop() { clearInterval(hPoll); clearInterval(hTimer); hPoll = hTimer = null; }

  async function hostCmd(cmd) {
    try {
      const r = await qapi("host", { pin: hostPin, cmd });
      syncClock(r); hState = r; renderHost();
    } catch (err) { alert(err.message); }
  }

  function hostTick() {
    if (!hState) return;
    const s = hState.state, el = $("#qzHTimer");
    if (s.phase !== "question" || !el) return;
    const t = serverNow();
    if (t < s.qStart) { el.textContent = Math.ceil((s.qStart - t) / 1000); el.dataset.ready = "1"; return; }
    if (el.dataset.ready) { renderHost(true); return; }
    const left = Math.max(0, Math.ceil((s.qEnd - t) / 1000));
    el.textContent = left;
    el.classList.toggle("hurry", left <= 5);
    const ring = $("#qzRing");
    if (ring) ring.style.setProperty("--p", Math.max(0, (s.qEnd - t) / (s.qEnd - s.qStart)));
    const total = Object.keys(s.players).length;
    // 시간이 끝나거나 모두 답하면 자동으로 정답 공개
    if (revealing !== s.qi && (t >= s.qEnd || (total > 0 && hState.answered >= total))) {
      revealing = s.qi; hostCmd("reveal");
    }
  }

  const joinUrl = (pin) => `${location.origin}${location.pathname}?quiz=${pin}#quiz`;

  function renderHost(force) {
    const r = hState, s = r.state, body = $("#qzHostBody");
    if (!body) return;
    const ready = s.phase === "question" && serverNow() < s.qStart;
    const players = Object.keys(s.players).length;
    const k = [s.phase, s.qi, ready, players, r.answered].join("|");
    if (k === hKey && !force) return;
    const sameLobby = hKey.startsWith("lobby|") && s.phase === "lobby";
    hKey = k;
    const q = s.qi >= 0 ? s.questions[s.qi] : null;
    const counter = `<span class="qz-count">문제 ${s.qi + 1} / ${s.questions.length}</span>`;

    if (s.phase === "lobby") {
      if (sameLobby) { // QR 은 그대로 두고 참가자만 갱신
        $("#qzPlayers").innerHTML = playerChips(s);
        $("#qzPlayerCount").textContent = players;
        $("#qzGo").disabled = !players;
        return;
      }
      const url = joinUrl(s.pin), local = /^(file:|http:\/\/(localhost|127\.|\[::1\]))/.test(location.href);
      body.innerHTML = `
        <div class="qz-lobby">
          <h2>${esc(s.title)}</h2>
          <div class="qz-joinbox">
            <div class="qz-qr" id="qzQr" aria-label="입장 QR 코드"></div>
            <div class="qz-joininfo">
              <p>📱 휴대폰 카메라로 QR 코드를 찍거나<br>사이트의 <b>실시간 퀴즈</b>에서 PIN 을 입력하세요</p>
              <div class="qz-pin">${s.pin.slice(0, 3)} ${s.pin.slice(3)}</div>
              <p class="qz-url">${esc(url)}</p>
              ${local ? `<p class="qz-warn">⚠️ 지금 주소는 이 컴퓨터에서만 열립니다. 학생 휴대폰으로 입장하려면 사이트를 인터넷에 배포하세요.</p>` : ""}
              ${DEMO ? `<p class="qz-warn">🧪 데모 모드: 같은 브라우저의 새 탭에서 위 주소를 열어 참가를 시험해 볼 수 있습니다.</p>` : ""}
            </div>
          </div>
          <p class="qz-pcount"><b id="qzPlayerCount">${players}</b>명 입장</p>
          <div class="qz-players" id="qzPlayers">${playerChips(s)}</div>
          <div class="qz-host-actions">
            <button class="btn" id="qzCancel">취소</button>
            <button class="btn primary big" id="qzGo"${players ? "" : " disabled"}>시작하기 ▶</button>
          </div>
        </div>`;
      drawQr($("#qzQr"), url);
      $("#qzGo").addEventListener("click", () => hostCmd("next"));
      $("#qzCancel").addEventListener("click", async () => { if (confirm("퀴즈를 닫을까요?")) { await hostCmd("end"); backToSetup(); } });
      return;
    }

    if (s.phase === "question") {
      const total = players, answered = r.answered || 0;
      body.innerHTML = `
        <div class="qz-stage">
          <div class="qz-stage-top">${counter}
            <div class="qz-ring" id="qzRing"><span class="qz-timer" id="qzHTimer"></span></div>
            <span class="qz-count"><b>${answered}</b> / ${total} 응답</span></div>
          <h2 class="qz-question">${esc(q.question)}</h2>
          ${ready ? `<p class="qz-getready">준비하세요!</p>` : `
          <div class="qz-tiles${q.choices.filter(Boolean).length === 2 ? " two" : ""}">${q.choices.map((c, i) => c ? `
            <div class="qz-tile ${COLORS[i]}"><span class="shape">${SHAPES[i]}</span><span>${esc(c)}</span></div>` : "").join("")}</div>`}
          <div class="qz-host-actions"><button class="btn" id="qzSkip">정답 공개</button></div>
        </div>`;
      $("#qzSkip").addEventListener("click", () => { revealing = s.qi; hostCmd("reveal"); });
      hostTick();
      return;
    }

    if (s.phase === "reveal") {
      const res = s.results[s.qi] || {}, counts = [0, 0, 0, 0];
      Object.values(res).forEach((x) => { if (x.c >= 0) counts[x.c]++; });
      const max = Math.max(1, ...counts), correctN = counts[q.answer], total = players;
      body.innerHTML = `
        <div class="qz-stage">
          <div class="qz-stage-top">${counter}<span class="qz-count">정답률 <b>${total ? Math.round((correctN / total) * 100) : 0}%</b></span></div>
          <h2 class="qz-question">${esc(q.question)}</h2>
          <div class="qz-bars">${q.choices.map((c, i) => c ? `
            <div class="qz-bar ${COLORS[i]}${i === q.answer ? " correct" : " dim"}">
              <div class="qz-bar-fill" style="height:${(counts[i] / max) * 100}%"><b>${counts[i]}</b></div>
              <div class="qz-bar-label"><span class="shape">${SHAPES[i]}</span> ${esc(c)} ${i === q.answer ? "✓" : ""}</div>
            </div>` : "").join("")}</div>
          ${q.explanation ? `<p class="qz-expl">💡 ${esc(q.explanation)}</p>` : ""}
          <div class="qz-host-actions">
            ${s.qi + 1 < s.questions.length ? `<button class="btn" id="qzEnd">여기서 끝내기</button>` : ""}
            <button class="btn" id="qzBoard">순위 보기</button>
            <button class="btn primary big" id="qzNext">${s.qi + 1 >= s.questions.length ? "최종 결과 ▶" : "다음 문제 ▶"}</button>
          </div>
        </div>`;
      $("#qzBoard").addEventListener("click", () => hostCmd("leaderboard"));
      $("#qzNext").addEventListener("click", () => hostCmd("next"));
      bindEnd();
      return;
    }

    if (s.phase === "leaderboard") {
      const top = r.ranking.slice(0, 5), max = Math.max(1, ...top.map((p) => p.score));
      body.innerHTML = `
        <div class="qz-stage">
          <div class="qz-stage-top">${counter}</div>
          <h2 class="qz-question">🏆 현재 순위</h2>
          <ol class="qz-board">${top.map((p) => `
            <li><span class="qz-rankno">${p.rank}</span><span class="qz-bname">${esc(p.name)}</span>
              <span class="qz-bbar"><i style="width:${(p.score / max) * 100}%"></i></span><b>${p.score.toLocaleString()}</b></li>`).join("")}</ol>
          <div class="qz-host-actions">
            ${s.qi + 1 < s.questions.length ? `<button class="btn" id="qzEnd">여기서 끝내기</button>` : ""}
            <button class="btn primary big" id="qzNext">${s.qi + 1 >= s.questions.length ? "최종 결과 ▶" : "다음 문제 ▶"}</button>
          </div>
        </div>`;
      $("#qzNext").addEventListener("click", () => hostCmd("next"));
      bindEnd();
      return;
    }

    if (s.phase === "ended") {
      const rk = r.ranking, podium = [rk[1], rk[0], rk[2]];
      body.innerHTML = `
        <div class="qz-stage">
          <h2 class="qz-question">🎉 ${esc(s.title)} · 최종 결과</h2>
          <div class="qz-podium">${podium.map((p, i) => p ? `
            <div class="qz-pod p${[2, 1, 3][i]}"><div class="qz-pod-name">${esc(p.name)}</div><div class="qz-pod-score">${p.score.toLocaleString()}점</div>
              <div class="qz-pod-block">${["🥈", "🥇", "🥉"][i]}</div></div>` : `<div class="qz-pod empty"></div>`).join("")}</div>
          <p class="muted">참가 ${rk.length}명 · ${played(s).length}문항</p>
          <div class="qz-host-actions">
            <button class="btn" id="qzCsv1">결과 CSV (학생별)</button>
            <button class="btn" id="qzCsv2">문항 분석 CSV</button>
            <button class="btn primary" id="qzBack">퀴즈 목록으로</button>
          </div>
        </div>`;
      if (!U.reduceMotion && body.dataset.celebrated !== s.pin) { body.dataset.celebrated = s.pin; U.confetti(); }
      $("#qzCsv1").addEventListener("click", () => exportResults(r));
      $("#qzCsv2").addEventListener("click", () => exportItems(r));
      $("#qzBack").addEventListener("click", backToSetup);
    }
  }
  function bindEnd() {
    const b = $("#qzEnd");
    if (b) b.addEventListener("click", () => {
      if (confirm("남은 문제를 건너뛰고 지금 최종 결과를 보여 줄까요?")) hostCmd("end");
    });
  }
  function backToSetup() { hostPin = null; hState = null; session.set("quiz.hostPin", null); renderSetup(); }
  const playerChips = (s) => Object.values(s.players).map((p) => `<span class="qz-chip">${esc(p.name)}</span>`).join("") ||
    `<p class="muted">학생들의 입장을 기다리는 중…</p>`;

  // QR 코드 (cdnjs 의 qrcodejs 사용, 인터넷이 없으면 주소만 표시)
  function drawQr(el, url) {
    const draw = () => {
      el.innerHTML = "";
      try { new window.QRCode(el, { text: url, width: 240, height: 240, colorDark: "#4a3b52", colorLight: "#ffffff", correctLevel: window.QRCode.CorrectLevel.M }); }
      catch { el.innerHTML = `<p class="muted small">QR 코드를 만들 수 없습니다. 주소나 PIN 으로 입장하세요.</p>`; }
    };
    if (window.QRCode) return draw();
    const sc = document.createElement("script");
    sc.src = "https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js";
    sc.onload = draw;
    sc.onerror = () => { el.innerHTML = `<p class="muted small">QR 코드를 불러오지 못했습니다(인터넷 연결 확인). 주소나 PIN 으로 입장하세요.</p>`; };
    document.head.appendChild(sc);
  }

  /* ---------- 3. 결과 CSV ---------- */
  const safeName = (t) => String(t || "퀴즈").replace(/[\\/:*?"<>|]/g, "_").slice(0, 40);
  const stamp = () => { const t = new Date(); return `${U.ymd(t)}_${U.pad(t.getHours())}${U.pad(t.getMinutes())}`; };
  function downloadFile(name, text, type) {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([text], { type }));
    a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }
  function csv(name, headers, rows) {
    const cell = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
    downloadFile(`${name}_${stamp()}.csv`, "﻿" + [headers, ...rows].map((r) => r.map(cell).join(",")).join("\r\n"), "text/csv;charset=utf-8");
  }
  const letter = (c) => (c >= 0 ? "ABCD"[c] : "무응답");
  // 중간에 끝낸 경우 실제로 출제된 문제만 결과에 넣음
  const played = (s) => s.questions.map((q, i) => i).filter((i) => s.results[i]);
  function exportResults(r) {
    const s = r.state, idx = played(s);
    const headers = ["순위", "이름", "학번", "총점", "정답 수", "정답률"];
    idx.forEach((i) => headers.push(`Q${i + 1} 응답`, `Q${i + 1} 정오`, `Q${i + 1} 점수`, `Q${i + 1} 응답시간(초)`));
    const rows = r.ranking.map((p) => {
      const per = idx.map((i) => (s.results[i] || {})[p.id] || { c: -1, ok: false, pts: 0, ms: null });
      const ok = per.filter((x) => x.ok).length;
      const row = [p.rank, p.name, p.sid || "", p.score, ok, idx.length ? Math.round((ok / idx.length) * 100) + "%" : ""];
      per.forEach((x) => row.push(letter(x.c), x.ok ? "O" : "X", x.pts, x.ms == null ? "" : (x.ms / 1000).toFixed(1)));
      return row;
    });
    csv(`퀴즈결과_${safeName(s.title)}`, headers, rows);
  }
  function exportItems(r) {
    const s = r.state, n = Object.keys(s.players).length;
    const rows = played(s).map((i) => {
      const q = s.questions[i], res = Object.values(s.results[i] || {}), cnt = [0, 0, 0, 0];
      let none = 0, okMs = [];
      res.forEach((x) => { if (x.c >= 0) cnt[x.c]++; else none++; if (x.ok) okMs.push(x.ms); });
      const avg = okMs.length ? (okMs.reduce((a, b) => a + b, 0) / okMs.length / 1000).toFixed(1) : "";
      return [i + 1, q.question, letter(q.answer) + ". " + q.choices[q.answer], n ? Math.round((cnt[q.answer] / n) * 100) + "%" : "",
        ...q.choices.map((c, k) => (c ? cnt[k] : "")), none, avg];
    });
    csv(`문항분석_${safeName(s.title)}`, ["번호", "문제", "정답", "정답률", "A 선택", "B 선택", "C 선택", "D 선택", "무응답", "정답자 평균 응답시간(초)"], rows);
  }
})();

</script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>일본어교과교재연구및지도법</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+JP:wght@600&display=swap" rel="stylesheet">
  <style>
/* 색상·모양은 여기 변수만 바꾸면 전체에 반영됩니다 */
:root {
  --pink-50: #fff6f9;
  --pink-100: #fde8f0;
  --pink-200: #f9cfe0;
  --pink-400: #ec8fb5;
  --pink-500: #e06a9d;
  --lavender-100: #f1ebfb;
  --lavender-200: #e0d3f5;
  --lavender-400: #b39ddb;
  --purple-600: #7e57c2;
  --text: #4a3b52;
  --text-soft: #7a6a82;
  --card: #ffffffd9;
  --radius: 22px;
  --shadow: 0 8px 28px rgba(176, 120, 170, 0.16);
  --header-h: 64px;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: calc(var(--header-h) + 12px); }
body {
  margin: 0;
  font-family: "Noto Sans KR", system-ui, sans-serif;
  color: var(--text);
  line-height: 1.7;
  background:
    radial-gradient(circle at 10% 0%, var(--pink-100), transparent 45%),
    radial-gradient(circle at 90% 30%, var(--lavender-100), transparent 40%),
    var(--pink-50);
  background-attachment: fixed;
}
a { color: inherit; }

/* ---------- 헤더 ---------- */
.site-header {
  position: sticky; top: 0; z-index: 50;
  height: var(--header-h);
  background: rgba(255, 246, 249, 0.82);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--pink-200);
  transition: box-shadow .25s;
}
.site-header.scrolled { box-shadow: 0 4px 18px rgba(176, 120, 170, 0.15); }
.header-inner {
  max-width: 1100px; height: 100%; margin: 0 auto; padding: 0 20px;
  display: flex; align-items: center; justify-content: space-between;
}
.logo {
  font-family: "Noto Serif JP", serif; font-size: 1.15rem; text-decoration: none;
  background: linear-gradient(90deg, var(--pink-500), var(--purple-600));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.logo::before { content: "🌸 "; -webkit-text-fill-color: initial; }
.site-nav { display: flex; gap: 4px; }
.site-nav a {
  text-decoration: none; font-size: .95rem; font-weight: 500;
  padding: 8px 14px; border-radius: 999px; color: var(--text-soft);
  transition: background .2s, color .2s;
}
.site-nav a:hover { background: var(--pink-100); color: var(--pink-500); }
.site-nav a.active { background: linear-gradient(90deg, var(--pink-200), var(--lavender-200)); color: var(--purple-600); }
.menu-toggle { display: none; }

/* ---------- 공통 섹션 ---------- */
main { max-width: 1100px; margin: 0 auto; padding: 0 20px; }
section { padding: 72px 0 24px; }
.section-title {
  text-align: center; font-size: clamp(1.5rem, 3vw, 2rem); margin: 0 0 8px;
}
.section-title::after {
  content: ""; display: block; width: 56px; height: 4px; border-radius: 4px; margin: 12px auto 0;
  background: linear-gradient(90deg, var(--pink-400), var(--lavender-400));
}
.section-lead { text-align: center; color: var(--text-soft); margin: 0 auto 36px; max-width: 640px; }

.card {
  background: var(--card);
  border: 1px solid #fff;
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 28px;
  transition: transform .25s, box-shadow .25s;
}
.card:hover { transform: translateY(-4px); box-shadow: 0 14px 34px rgba(176, 120, 170, 0.24); }
.grid { display: grid; gap: 20px; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
.card-icon {
  width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; font-size: 1.6rem;
  background: linear-gradient(135deg, var(--pink-100), var(--lavender-100)); margin-bottom: 14px;
}
.card h3 { margin: 0 0 8px; font-size: 1.1rem; }
.card p { margin: 0; color: var(--text-soft); font-size: .95rem; }
.card ul { margin: 0; padding-left: 18px; color: var(--text-soft); font-size: .95rem; }

/* ---------- 히어로 ---------- */
.hero { text-align: center; padding: 96px 0 56px; position: relative; }
.hero-logo { display: block; height: clamp(44px, 10vw, 64px); width: auto; margin: 0 auto 20px; }
.hero-badge {
  display: inline-block; padding: 6px 16px; border-radius: 999px; font-size: .85rem; font-weight: 500;
  background: #fff; color: var(--purple-600); box-shadow: var(--shadow); margin-bottom: 20px;
}
.hero h1 { font-size: clamp(1.5rem, 6.6vw, 3.4rem); line-height: 1.3; margin: 0 0 10px; letter-spacing: -0.02em; }
.hero-subtitle {
  font-size: clamp(1.2rem, 4vw, 1.9rem); font-weight: 700; margin: 0 0 20px;
  background: linear-gradient(90deg, var(--pink-500), var(--purple-600));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.hero .desc { max-width: 680px; margin: 0 auto 32px; color: var(--text-soft); font-size: 1.05rem; word-break: keep-all; }
.btns { display: flex; gap: 12px; justify-content: center; }
.btn {
  min-width: 150px; text-align: center;
  text-decoration: none; padding: 13px 28px; border-radius: 999px; font-weight: 500;
  border: 1.5px solid var(--pink-400); color: var(--pink-500); background: #fff;
  transition: transform .2s, box-shadow .2s;
}
.btn.primary { border: none; color: #fff; background: linear-gradient(90deg, var(--pink-400), var(--lavender-400)); }
.btn:hover { transform: translateY(-2px); box-shadow: var(--shadow); }

/* 떨어지는 꽃잎 */
.petals { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.petal {
  position: absolute; top: -20px; width: 12px; height: 10px; opacity: .55;
  background: var(--pink-200); border-radius: 12px 0 12px 0;
  animation: fall linear infinite;
}
@keyframes fall {
  to { transform: translate(80px, 105vh) rotate(540deg); }
}
main, .site-footer { position: relative; z-index: 1; }

/* ---------- 커리큘럼 ---------- */
.chip {
  border: 1px solid var(--pink-200); background: #fff; color: var(--text-soft);
  padding: 6px 14px; border-radius: 999px; font: inherit; font-size: .85rem; cursor: pointer;
  transition: background .2s, color .2s;
}
.chip:hover { background: var(--pink-100); color: var(--pink-500); }
.week-tools { display: flex; justify-content: flex-end; gap: 8px; max-width: 880px; margin: 0 auto 14px; }
.week-list { display: grid; gap: 14px; max-width: 880px; margin: 0 auto; }
.week-card { padding: 0; overflow: hidden; scroll-margin-top: calc(var(--header-h) + 16px); }
.week-card:hover { transform: none; }
.week-card.current { border: 2px solid var(--pink-400); }
.week-card summary {
  list-style: none; cursor: pointer; position: relative;
  display: grid; grid-template-columns: auto 1fr auto; gap: 18px; align-items: center;
  padding: 18px 56px 18px 20px;
}
.week-card summary::-webkit-details-marker { display: none; }
.week-card summary::after {
  content: "›"; position: absolute; right: 22px; top: 50%; transform: translateY(-50%) rotate(90deg);
  font-size: 1.6rem; color: var(--lavender-400); transition: transform .25s;
}
.week-card[open] summary::after { transform: translateY(-50%) rotate(-90deg); }
.week-no {
  width: 58px; height: 58px; border-radius: 18px; display: grid; place-items: center; align-content: center;
  font-size: 1.35rem; font-weight: 700; line-height: 1; color: var(--purple-600);
  background: linear-gradient(135deg, var(--pink-100), var(--lavender-200));
}
.week-no small { font-size: .65rem; font-weight: 500; margin-top: 3px; }
.week-main { min-width: 0; }
.week-dates { display: block; font-size: .82rem; color: var(--pink-500); font-weight: 500; }
.week-main strong { display: block; font-weight: 500; line-height: 1.5; word-break: keep-all; }
.week-badges { display: flex; flex-wrap: wrap; gap: 6px; }
.badge {
  display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: .75rem; font-weight: 700; white-space: nowrap;
}
.badge.now { background: linear-gradient(90deg, var(--pink-400), var(--lavender-400)); color: #fff; }
.badge.hw { background: #fff1e6; color: #d9771f; }
.badge.off { background: #eeeaf2; color: var(--text-soft); }
.week-body { margin: 0 24px; padding: 20px 0 26px; border-top: 1px dashed var(--pink-200); }
.week-body h4, .cal-detail h4 { margin: 20px 0 8px; font-size: .98rem; }
.week-meta { display: grid; grid-template-columns: 1.4fr 1fr; gap: 14px; }
.week-meta > div { background: var(--pink-50); border-radius: 16px; padding: 14px 16px; }
.week-meta span { display: block; font-size: .82rem; font-weight: 700; color: var(--purple-600); margin-bottom: 4px; }
.week-meta ul { list-style: none; padding: 0; margin: 0; font-size: .92rem; }
.week-meta li b { color: var(--pink-500); font-weight: 500; margin-right: 4px; }
.week-meta li.off { color: var(--text-soft); text-decoration: line-through; }
.week-meta p { margin: 0; font-size: .92rem; }
.content-list { margin: 0; padding-left: 20px; color: var(--text-soft); font-size: .95rem; }
.card .video-list { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 8px; }
.video-list a {
  display: inline-block; padding: 6px 14px; border-radius: 999px; font-size: .88rem; text-decoration: none;
  background: var(--lavender-100); color: var(--purple-600); transition: background .2s;
}
.video-list a:hover { background: var(--lavender-200); }

.assignment {
  margin-top: 20px; padding: 18px 20px; border-radius: 18px;
  background: linear-gradient(135deg, #fff7ef, var(--pink-50)); border: 1px solid #fbd9bd;
}
.assignment-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.assignment-label { font-size: .8rem; font-weight: 700; color: #d9771f; }
.assignment p { margin: 8px 0 14px; color: var(--text-soft); font-size: .93rem; }
.assignment-foot { display: flex; justify-content: space-between; align-items: center; gap: 14px; }
.due { display: block; font-weight: 500; font-size: .92rem; }
.countdown { display: inline-block; margin-top: 4px; padding: 2px 10px; border-radius: 999px; font-size: .8rem; font-weight: 700; }
.countdown[data-state="open"] { background: var(--lavender-100); color: var(--purple-600); }
.countdown[data-state="soon"] { background: #ffe3e3; color: #d6336c; }
.countdown[data-state="closed"] { background: #eeeaf2; color: var(--text-soft); }
.submit-btn { min-width: 130px; padding: 10px 22px; }
.btn.disabled { background: #e4dfe8; color: #9b8fa3; cursor: not-allowed; box-shadow: none; transform: none; }

/* ---------- 월간 달력 ---------- */
.calendar-wrap { display: grid; grid-template-columns: 1.35fr 1fr; gap: 20px; align-items: start; }
.calendar:hover, .cal-detail:hover { transform: none; }
.cal-head { display: flex; align-items: center; justify-content: space-between; }
.cal-head h3 { margin: 0; font-size: 1.25rem; }
.cal-nav {
  width: 40px; height: 40px; border-radius: 50%; border: none; cursor: pointer; font-size: 1.4rem;
  background: var(--pink-100); color: var(--pink-500); transition: background .2s;
}
.cal-nav:hover { background: var(--pink-200); }
.cal-sub { display: flex; justify-content: space-between; align-items: center; margin: 8px 0 14px; font-size: .85rem; color: var(--text-soft); }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.cal-dow span { text-align: center; font-size: .8rem; font-weight: 700; color: var(--text-soft); padding-bottom: 4px; }
.cal-dow span:first-child { color: #e0607e; }
.cal-cell {
  position: relative; min-height: 64px; border: none; border-radius: 14px; padding: 6px 4px;
  background: transparent; font: inherit; color: var(--text); cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  transition: background .2s;
}
.cal-cell.empty { cursor: default; }
.cal-cell:not(.empty):hover { background: var(--pink-50); }
.cal-cell .num { font-size: .92rem; width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; }
.cal-cell.sun .num { color: #e0607e; }
.cal-cell.class { background: linear-gradient(135deg, var(--pink-100), var(--lavender-100)); }
.cal-cell.class .num { font-weight: 700; color: var(--purple-600); }
.cal-cell.off { background: #f3f0f5; }
.cal-cell.off .num { color: var(--text-soft); text-decoration: line-through; }
.cal-label { font-size: .7rem; font-weight: 500; color: var(--pink-500); white-space: nowrap; }
.cal-cell.off .cal-label { color: var(--text-soft); }
.cal-cell.today .num { background: var(--pink-500); color: #fff !important; }
.cal-cell.selected { outline: 2px solid var(--purple-600); outline-offset: -2px; }
.cal-cell .dot.hw { position: absolute; top: 6px; right: 6px; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; }
.dot.class { background: linear-gradient(135deg, var(--pink-400), var(--lavender-400)); }
.dot.off { background: #cfc6d6; }
.dot.hw { background: #f08c3a; }
.cal-legend { display: flex; gap: 16px; justify-content: center; margin-top: 14px; font-size: .8rem; color: var(--text-soft); }
.cal-legend span { display: flex; align-items: center; gap: 6px; }

.cal-detail { position: sticky; top: calc(var(--header-h) + 16px); }
.detail-date { font-size: .85rem; font-weight: 700; color: var(--pink-500); }
.cal-detail h3 { margin: 6px 0 12px; font-size: 1.15rem; line-height: 1.5; word-break: keep-all; }
.cal-detail h3 .badge { vertical-align: 2px; }
.card .detail-meta { list-style: none; padding: 0; margin: 0; font-size: .93rem; color: var(--text-soft); }
.muted { color: var(--text-soft); margin: 0; }
.detail-due {
  margin: 16px 0 0; padding: 12px 14px; border-radius: 14px; font-size: .9rem;
  background: #fff7ef; border: 1px solid #fbd9bd;
}
.detail-due .countdown { margin-left: 4px; }
.detail-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
.detail-actions .btn { min-width: 0; padding: 10px 18px; font-size: .9rem; cursor: pointer; font-family: inherit; }

/* ---------- FAQ ---------- */
.faq-list { max-width: 820px; margin: 0 auto; display: grid; gap: 14px; }
.faq-item { padding: 0; overflow: hidden; }
.faq-item:hover { transform: none; }
.faq-item summary {
  list-style: none; cursor: pointer; padding: 20px 56px 20px 24px; font-weight: 500; position: relative;
}
.faq-item summary::-webkit-details-marker { display: none; }
.faq-item summary::before { content: "Q. "; color: var(--pink-500); font-weight: 700; }
.faq-item summary::after {
  content: "+"; position: absolute; right: 24px; top: 50%; transform: translateY(-50%);
  font-size: 1.4rem; color: var(--lavender-400); transition: transform .25s;
}
.faq-item[open] summary::after { transform: translateY(-50%) rotate(45deg); }
.faq-item .answer { padding: 0 24px 20px; color: var(--text-soft); }

/* ---------- 한눈에 보기 ---------- */
.info-bar {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; padding: 8px;
  max-width: 1000px; margin: 0 auto;
}
.info-bar:hover { transform: none; }
.info-item { display: flex; gap: 12px; align-items: center; padding: 16px 18px; }
.info-item + .info-item { border-left: 1px dashed var(--pink-200); }
.info-icon {
  flex-shrink: 0; width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center;
  font-size: 1.25rem; background: linear-gradient(135deg, var(--pink-100), var(--lavender-100));
}
.info-label { display: block; font-size: .8rem; color: var(--pink-500); font-weight: 500; }
.info-item strong { display: block; font-size: .92rem; font-weight: 500; line-height: 1.45; word-break: keep-all; }

/* ---------- 숫자 강조 카드 ---------- */
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-top: 56px; }
.stat { text-align: center; padding: 30px 16px; }
.stat-num {
  font-size: clamp(2.2rem, 5vw, 3rem); font-weight: 700; line-height: 1.1;
  background: linear-gradient(135deg, var(--pink-500), var(--purple-600));
  -webkit-background-clip: text; background-clip: text; color: transparent;
  font-variant-numeric: tabular-nums;
}
.stat-num small { font-size: .45em; margin-left: 2px; }
.stat p { margin-top: 8px; font-weight: 500; }

/* ---------- 장점 슬라이드 ---------- */
.slider { position: relative; }
.slider-track {
  display: grid; grid-auto-flow: column; grid-auto-columns: calc((100% - 40px) / 3); column-gap: 20px;
  overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth;
  padding: 8px 4px 24px; margin: 0 -4px; scrollbar-width: none; outline: none;
}
.slider-track::-webkit-scrollbar { display: none; }
.slide { scroll-snap-align: start; display: flex; }
.slide .card { flex: 1; }
.slider-btn {
  position: absolute; top: 50%; transform: translateY(-60%); z-index: 2;
  width: 44px; height: 44px; border-radius: 50%; border: none; cursor: pointer;
  font-size: 1.6rem; line-height: 1; color: var(--purple-600); background: #fff; box-shadow: var(--shadow);
  transition: opacity .2s, transform .2s;
}
.slider-btn:hover { transform: translateY(-60%) scale(1.08); }
.slider-btn:disabled { opacity: 0; pointer-events: none; }
.slider-btn.prev { left: -18px; }
.slider-btn.next { right: -18px; }
.slider-dots { display: flex; justify-content: center; gap: 8px; }
.slider-dots button {
  width: 9px; height: 9px; padding: 0; border: none; border-radius: 999px; cursor: pointer;
  background: var(--pink-200); transition: width .25s, background .25s;
}
.slider-dots button.active { width: 26px; background: linear-gradient(90deg, var(--pink-400), var(--lavender-400)); }

/* ---------- AI 도구 ---------- */
.tools-grid { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.tool { display: flex; gap: 16px; align-items: center; padding: 22px 24px; }
.tool .card-icon { margin: 0; flex-shrink: 0; }
.tool h3 { margin-bottom: 2px; }

/* ---------- 푸터: 교수자 소개 ---------- */
.site-footer {
  margin-top: 88px; padding: 56px 20px 28px;
  background: linear-gradient(135deg, var(--pink-100), var(--lavender-100));
  border-top-left-radius: 40px; border-top-right-radius: 40px;
}
.footer-inner {
  max-width: 1000px; margin: 0 auto;
  display: grid; grid-template-columns: auto 1fr auto; gap: 32px; align-items: center;
}
.avatar {
  width: 140px; height: 140px; border-radius: 50%; object-fit: cover;
  display: grid; place-items: center; font-size: 3.5rem;
  background: linear-gradient(135deg, var(--pink-200), var(--lavender-200));
  border: 5px solid #fff; box-shadow: var(--shadow);
}
.footer-kicker { font-size: .8rem; font-weight: 700; color: var(--pink-500); letter-spacing: .08em; }
.footer-body h3 { font-size: 1.5rem; margin: 2px 0 0; }
.footer-body .role { color: var(--purple-600); margin: 0 0 8px; }
.footer-body .bio { margin: 0; color: var(--text-soft); word-break: keep-all; }
.tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.tag { padding: 4px 12px; border-radius: 999px; font-size: .85rem; background: #fff; color: var(--pink-500); }
.contact {
  list-style: none; margin: 0; padding: 20px 24px; min-width: 250px;
  background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); font-size: .92rem;
}
.contact li { display: flex; gap: 12px; padding: 5px 0; }
.contact b { flex-shrink: 0; width: 48px; color: var(--purple-600); font-weight: 500; }
.contact a { color: var(--pink-500); text-decoration: none; word-break: break-all; }
.contact a:hover { text-decoration: underline; }
.copyright {
  max-width: 1000px; margin: 40px auto 0; padding-top: 20px; text-align: center;
  border-top: 1px solid var(--pink-200); color: var(--text-soft); font-size: .82rem;
}

/* ---------- 맨 위로 ---------- */
.to-top {
  position: fixed; right: 20px; bottom: 20px; z-index: 60;
  width: 48px; height: 48px; border-radius: 50%; border: none; cursor: pointer;
  font-size: 1.3rem; color: #fff;
  background: linear-gradient(135deg, var(--pink-400), var(--lavender-400));
  box-shadow: var(--shadow);
  opacity: 0; visibility: hidden; transform: translateY(12px);
  transition: opacity .3s, transform .3s, visibility .3s;
}
.to-top.show { opacity: 1; visibility: visible; transform: none; }

/* ---------- 참여하기: 공통 ---------- */
.site-nav a.cta { background: linear-gradient(90deg, var(--pink-400), var(--lavender-400)); color: #fff; margin-left: 6px; }
.site-nav a.cta:hover, .site-nav a.cta.active { color: #fff; filter: brightness(1.05); }
.demo-note {
  max-width: 880px; margin: -16px auto 24px; padding: 10px 16px; border-radius: 14px; text-align: center;
  font-size: .85rem; color: #8a5a00; background: #fff8e1; border: 1px dashed #f2cf73;
}
.demo-note code { background: #fff; padding: 1px 6px; border-radius: 6px; font-size: .8rem; }
.small { font-size: .85rem; }
.muted { color: var(--text-soft); }
.wide-btn { display: block; width: 100%; text-align: center; cursor: pointer; font: inherit; font-weight: 500; }
button.btn { font-family: inherit; font-size: 1rem; cursor: pointer; }
.btn:disabled { opacity: .55; cursor: not-allowed; transform: none; box-shadow: none; }
.form-msg { min-height: 1.4em; margin: 10px 0 0; font-size: .88rem; color: var(--purple-600); }
.form-msg.error { color: #d6336c; }
.form-msg.success { color: #2b8a3e; }
.participate-grid { display: grid; grid-template-columns: 1fr 1.2fr; gap: 20px; align-items: start; }
.participate-grid .card:hover, .student-grid .card:hover, .records:hover, .login-card:hover, .student-bar:hover { transform: none; }

/* ---------- 투표 ---------- */
.poll-head { display: flex; align-items: center; gap: 8px; font-size: .8rem; font-weight: 700; color: #d6336c; }
.live-dot { width: 9px; height: 9px; border-radius: 50%; background: #ff4d79; animation: pulse 1.6s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255,77,121,.5); } 70% { box-shadow: 0 0 0 9px rgba(255,77,121,0); } 100% { box-shadow: 0 0 0 0 rgba(255,77,121,0); } }
.poll h3 { margin: 8px 0 16px; font-size: 1.2rem; }
.poll-options { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.poll-options .btn, .poll-options .form-msg { grid-column: 1 / -1; }
.poll-option {
  display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 14px; cursor: pointer;
  border: 1.5px solid var(--pink-200); background: #fff; font-size: .92rem; transition: border-color .2s, background .2s;
}
.poll-option:hover { border-color: var(--pink-400); }
.poll-option:has(input:checked) { border-color: var(--purple-600); background: var(--lavender-100); }
.poll-option input { accent-color: var(--purple-600); }
.poll-options.voted .poll-option { opacity: .6; cursor: default; }
.poll-results { margin-top: 22px; display: grid; gap: 12px; }
.bar-label { display: flex; justify-content: space-between; gap: 8px; font-size: .88rem; margin-bottom: 4px; }
.bar-label b { font-weight: 500; color: var(--text-soft); white-space: nowrap; }
.bar-label em { font-style: normal; font-size: .72rem; padding: 1px 7px; border-radius: 999px; background: var(--purple-600); color: #fff; margin-left: 4px; }
.bar-track { height: 14px; border-radius: 999px; background: var(--pink-100); overflow: hidden; }
.bar-fill {
  height: 100%; border-radius: 999px; min-width: 0;
  background: linear-gradient(90deg, var(--pink-200), var(--lavender-400));
  transition: width .8s cubic-bezier(.2,.8,.2,1);
}
.bar-row.top .bar-fill { background: linear-gradient(90deg, var(--pink-400), var(--purple-600)); }
.poll-meta { margin: 14px 0 0; font-size: .78rem; color: var(--text-soft); }

/* ---------- 수강 신청서 ---------- */
.apply h3 { margin: 0 0 2px; font-size: 1.2rem; }
.req { color: #d6336c; }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 16px; margin: 16px 0 20px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field.wide, .field-check { grid-column: 1 / -1; }
.field > label { font-size: .88rem; font-weight: 500; }
.field input, .field select, .field textarea {
  font: inherit; font-size: .95rem; color: var(--text); padding: 10px 14px; border-radius: 14px;
  border: 1.5px solid var(--pink-200); background: #fff; width: 100%; transition: border-color .2s, box-shadow .2s;
}
.field textarea { resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus {
  outline: none; border-color: var(--lavender-400); box-shadow: 0 0 0 4px var(--lavender-100);
}
.field-check label { display: flex; gap: 8px; align-items: flex-start; font-size: .9rem; cursor: pointer; }
.field-check input { width: 18px; height: 18px; margin-top: 3px; accent-color: var(--purple-600); flex-shrink: 0; }
.field-error { margin: 0; font-size: .8rem; color: #d6336c; min-height: 0; }
.field-error:empty { display: none; }
.field.invalid input, .field.invalid select, .field.invalid textarea { border-color: #f06595; background: #fff5f7; }
.error-summary {
  margin-top: 14px; padding: 14px 16px; border-radius: 14px; font-size: .88rem;
  background: #fff0f3; border: 1px solid #ffc2d1; color: #a61e4d;
}
.error-summary ul { margin: 6px 0 0; padding-left: 18px; color: #a61e4d; }
.error-summary a { color: inherit; font-weight: 500; }
.apply-done { text-align: center; padding: 30px 10px; }
.done-icon { font-size: 3rem; }
.apply-done p { color: var(--text-soft); }

/* ---------- 수강생 공간 ---------- */
.login-card { max-width: 440px; margin: 0 auto; }
.login-card form { display: grid; gap: 14px; margin: 16px 0 8px; }
.student-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 22px; margin-bottom: 20px; }
.student-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
.att-status { margin: 0 0 6px; font-weight: 500; }
.att-status.ok { color: #2b8a3e; }
.att-status.open { color: var(--purple-600); }
.att-status.late { color: #d9771f; }
#attendBtn { margin-top: 14px; }
#submitForm { display: grid; gap: 14px; }
#hwDue { margin: 2px 0 0; }
.dropzone {
  position: relative; display: flex; gap: 12px; align-items: center; padding: 18px; border-radius: 16px; cursor: pointer;
  border: 2px dashed var(--pink-200); background: var(--pink-50); font-size: .9rem; color: var(--text-soft);
  transition: border-color .2s, background .2s;
}
.dropzone:hover, .dropzone.drag { border-color: var(--lavender-400); background: var(--lavender-100); }
.dropzone.has-file { border-style: solid; border-color: var(--purple-600); color: var(--text); }
.dropzone input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.dz-icon { font-size: 1.6rem; }
.records h3 { margin-top: 0; }
.records-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.records h4 { margin: 0 0 8px; font-size: .95rem; color: var(--purple-600); }
.card .record-list { list-style: none; padding: 0; margin: 0; font-size: .9rem; }
.record-list li { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; padding: 8px 0; border-bottom: 1px dashed var(--pink-200); }
.record-list li:last-child { border-bottom: none; }
.record-list b.ok { color: #2b8a3e; } .record-list b.late { color: #d9771f; }
.record-list small { color: var(--text-soft); }

/* ---------- 토스트 · 폭죽 · 팝업 ---------- */
.toast {
  position: fixed; left: 50%; top: calc(var(--header-h) + 16px); z-index: 120;
  transform: translate(-50%, -16px); opacity: 0; transition: opacity .35s, transform .35s;
  padding: 12px 22px; border-radius: 999px; font-weight: 500; color: #fff; white-space: nowrap; font-size: .95rem;
  background: linear-gradient(90deg, var(--pink-500), var(--purple-600)); box-shadow: var(--shadow);
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.confetti { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 110; }
.modal-backdrop {
  position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 16px;
  background: rgba(74, 59, 82, .35); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  opacity: 0; transition: opacity .3s;
}
.modal-backdrop.show { opacity: 1; }
.modal {
  position: relative; width: min(400px, 100%); padding: 32px 28px 0; border-radius: 28px; text-align: center;
  background: #fff; box-shadow: 0 20px 60px rgba(126, 87, 194, .25);
  max-height: calc(100vh - 32px); overflow-x: hidden; overflow-y: auto;
  transform: translateY(20px) scale(.97); transition: transform .3s;
}
.modal-backdrop.show .modal { transform: none; }
.modal::before {
  content: ""; position: absolute; inset: 0 0 auto; height: 90px;
  background: linear-gradient(135deg, var(--pink-100), var(--lavender-100)); z-index: 0;
}
.modal > * { position: relative; }
.modal-icon { font-size: 2.6rem; }
.modal h3 { margin: 6px 0 12px; font-size: 1.25rem; }
.modal p { margin: 4px 0; color: var(--text-soft); font-size: .93rem; word-break: keep-all; }
.modal .btn { margin-top: 20px; }
.modal-x {
  position: absolute; top: 12px; right: 14px; width: 34px; height: 34px; border-radius: 50%; border: none;
  background: rgba(255,255,255,.8); font-size: 1.3rem; color: var(--text-soft); cursor: pointer; z-index: 1;
}
.modal-foot { display: flex; margin: 22px -28px 0; border-top: 1px solid var(--pink-100); }
.modal-foot button {
  flex: 1; padding: 14px; border: none; background: var(--pink-50); font: inherit; font-size: .88rem;
  color: var(--text-soft); cursor: pointer;
}
.modal-foot button + button { border-left: 1px solid var(--pink-100); }
.modal-foot button:hover { background: var(--pink-100); color: var(--pink-500); }

@media (max-width: 960px) {
  .participate-grid { grid-template-columns: 1fr; }
}
@media (max-width: 760px) {
  .fields, .student-grid, .records-grid { grid-template-columns: 1fr; }
  .poll-options { grid-template-columns: 1fr; }
  .student-bar { padding: 12px 16px; font-size: .9rem; }
}

/* ---------- 헤더 오른쪽: 관리자 자물쇠 ---------- */
.header-inner { justify-content: flex-start; gap: 8px; }
.site-nav { margin-left: auto; }
.header-actions { display: flex; align-items: center; gap: 8px; }
.admin-btn {
  width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--pink-200); cursor: pointer;
  display: grid; place-items: center; background: #fff; color: var(--text-soft); transition: color .2s, background .2s;
}
.admin-btn:hover { color: var(--purple-600); background: var(--lavender-100); }

/* ---------- 공지사항 ---------- */
#notices { padding-top: 32px; }
.notice-box { max-width: 1000px; margin: 0 auto; padding: 20px 26px; }
.notice-box:hover { transform: none; }
.notice-title { font-size: 1.05rem; margin: 0 0 8px; }
.card .notice-list { list-style: none; padding: 0; margin: 0; }
.notice-list li + li { border-top: 1px dashed var(--pink-200); }
.notice-list summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 10px 0; }
.notice-list summary::-webkit-details-marker { display: none; }
.notice-text { flex: 1; min-width: 0; font-weight: 500; }
.notice-list time { font-size: .8rem; color: var(--text-soft); white-space: nowrap; }
.notice-list p { margin: 0 0 12px; padding: 12px 14px; border-radius: 12px; background: var(--pink-50); color: var(--text-soft); font-size: .92rem; }

/* ---------- 관리자 화면 ---------- */
body.admin-open { overflow: hidden; }
.modal.shake { animation: shake .4s; }
@keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
.admin-login .field { margin-top: 14px; }
.admin-login .form-msg { min-height: 1.2em; }
.admin-overlay {
  position: fixed; inset: 0; z-index: 90; padding: 20px; display: grid; place-items: center;
  background: rgba(74, 59, 82, .4); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  opacity: 0; visibility: hidden; transition: opacity .25s, visibility .25s;
}
.admin-overlay.show { opacity: 1; visibility: visible; }
.admin-panel {
  width: min(1180px, 100%); height: min(860px, 100%); display: flex; flex-direction: column;
  background: #fffafc; border-radius: 26px; box-shadow: 0 24px 70px rgba(126, 87, 194, .3); overflow: hidden;
}
.admin-head {
  display: flex; align-items: center; gap: 10px; padding: 14px 18px;
  background: linear-gradient(90deg, var(--pink-100), var(--lavender-100));
}
.admin-head .modal-x { position: static; }
.spacer { flex: 1; }
.admin-tabs { display: flex; gap: 4px; padding: 10px 14px; overflow-x: auto; border-bottom: 1px solid var(--pink-100); scrollbar-width: thin; }
.admin-tabs button {
  flex-shrink: 0; border: none; background: transparent; font: inherit; font-size: .9rem; padding: 8px 14px;
  border-radius: 999px; cursor: pointer; color: var(--text-soft);
}
.admin-tabs button:hover { background: var(--pink-50); }
.admin-tabs button[aria-selected="true"] { background: var(--purple-600); color: #fff; }
.admin-body { flex: 1; overflow: auto; padding: 22px 24px 40px; }
.admin-body h3 { margin: 20px 0 10px; font-size: 1.05rem; }
.admin-body h3 small { color: var(--text-soft); font-weight: 400; margin-left: 4px; }
.admin-body .demo-note { margin: 0 0 16px; max-width: none; }
.adm-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; }
.adm-card {
  display: grid; justify-items: center; gap: 2px; padding: 18px 10px; border-radius: 18px; cursor: pointer;
  border: 1px solid var(--pink-100); background: #fff; font: inherit; color: var(--text); box-shadow: var(--shadow);
}
.adm-card:disabled { cursor: default; }
.adm-card span { font-size: 1.5rem; }
.adm-card b { font-size: 1.8rem; color: var(--purple-600); }
.adm-card small { color: var(--text-soft); }
.adm-help { margin-top: 22px; padding: 16px 20px; border-radius: 18px; background: #fff; border: 1px solid var(--pink-100); font-size: .9rem; }
.adm-help h4 { margin: 0 0 6px; }
.adm-help ul { margin: 0; padding-left: 18px; color: var(--text-soft); }
.adm-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.adm-toolbar h3 { margin: 0; }
.admin-body .btn { padding: 9px 18px; font-size: .9rem; min-width: 0; }
.chip.danger, .ed-mini.danger { color: #d6336c; border-color: #ffc2d1; }
.chip.danger:hover { background: #fff0f3; }
.empty { padding: 20px; text-align: center; background: #fff; border-radius: 14px; }
.table-wrap { overflow: auto; margin: 12px 0; border-radius: 14px; border: 1px solid var(--pink-100); background: #fff; max-height: 60vh; }
.adm-table { border-collapse: collapse; width: 100%; font-size: .85rem; }
.adm-table th, .adm-table td { padding: 8px 10px; border-bottom: 1px solid var(--pink-100); text-align: left; white-space: nowrap; }
.adm-table th { position: sticky; top: 0; background: var(--lavender-100); font-weight: 500; z-index: 1; }
.adm-table.matrix td:nth-child(n+3) { text-align: center; }
.adm-table tbody tr:hover { background: var(--pink-50); }
.c-ok { color: #2b8a3e; } .c-late { color: #d9771f; font-weight: 500; } .c-no { color: #d6336c; font-weight: 500; }
.roster-table input { width: 100%; min-width: 90px; font: inherit; font-size: .88rem; padding: 6px 8px; border: 1px solid var(--pink-200); border-radius: 8px; }
.bulk { margin-top: 14px; padding: 12px 16px; border-radius: 14px; background: #fff; border: 1px dashed var(--pink-200); }
.bulk summary { cursor: pointer; font-weight: 500; }
.bulk textarea { width: 100%; font: inherit; font-size: .88rem; padding: 10px; border-radius: 10px; border: 1px solid var(--pink-200); margin-bottom: 8px; }
.notice-form { display: grid; gap: 12px; max-width: 640px; padding: 18px 20px; border-radius: 18px; background: #fff; border: 1px solid var(--pink-100); }
.notice-form h3 { margin: 0; }
.notice-form .btn { justify-self: start; }
.check { display: flex; gap: 8px; align-items: center; font-size: .9rem; }
.adm-notices { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
.adm-notices li { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; padding: 14px 16px; border-radius: 14px; background: #fff; border: 1px solid var(--pink-100); }
.adm-notices small { margin-left: 8px; color: var(--text-soft); }
.adm-notices p { margin: 4px 0 0; color: var(--text-soft); font-size: .9rem; white-space: pre-line; }
.file-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
.adm-box { padding: 18px 20px; border-radius: 18px; background: #fff; border: 1px solid var(--pink-100); display: grid; gap: 10px; align-content: start; }
.adm-box h3 { margin: 0; }
.adm-box p { margin: 0; }
.adm-box .btn { justify-self: start; }
.hash { display: block; word-break: break-all; font-size: .78rem; padding: 8px 10px; border-radius: 8px; background: var(--lavender-100); user-select: all; }

/* 설정 편집기 */
.edit-bar { position: sticky; top: -22px; z-index: 2; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 10px 0; background: #fffafc; }
.edit-bar select { font: inherit; padding: 8px 12px; border-radius: 12px; border: 1.5px solid var(--pink-200); margin-left: 6px; }
.dirty-flag { color: #d9771f; font-size: .85rem; font-weight: 500; }
.editor { margin-top: 10px; }
.ed-obj { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px 14px; }
.ed-field { display: grid; gap: 4px; }
.ed-field.wide, .ed-obj > fieldset { grid-column: 1 / -1; }
.ed-field label { font-size: .8rem; font-weight: 500; color: var(--purple-600); }
.ed-field input, .ed-field textarea {
  font: inherit; font-size: .9rem; padding: 8px 10px; border-radius: 10px; border: 1.5px solid var(--pink-200); background: #fff; width: 100%;
}
.ed-field input:focus, .ed-field textarea:focus { outline: none; border-color: var(--lavender-400); box-shadow: 0 0 0 3px var(--lavender-100); }
.ed-check label { display: flex; gap: 6px; align-items: center; color: var(--text); font-weight: 400; font-size: .9rem; padding-top: 18px; }
.ed-array, .ed-group { border: 1px solid var(--pink-100); border-radius: 16px; padding: 12px 14px; margin: 0; background: rgba(255,255,255,.7); display: grid; gap: 10px; }
.ed-array > legend, .ed-group > legend { font-weight: 700; font-size: .88rem; padding: 0 6px; color: var(--text); }
.ed-array > legend small { color: var(--text-soft); font-weight: 400; }
.ed-array > .chip { justify-self: start; }
.ed-item { border-radius: 14px; padding: 10px 12px; background: #fff; border: 1px solid var(--pink-100); display: grid; gap: 8px; }
.ed-item-head { display: flex; align-items: center; gap: 4px; }
.ed-item-head span { font-size: .78rem; font-weight: 700; color: var(--pink-500); margin-right: auto; }
.ed-mini { width: 28px; height: 28px; border-radius: 8px; border: 1px solid var(--pink-200); background: #fff; cursor: pointer; font-size: .85rem; color: var(--text-soft); }
.ed-mini:hover { background: var(--pink-50); }

/* 미리보기 안내 띠 */
.draft-bar {
  position: fixed; left: 16px; bottom: 16px; z-index: 70; display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
  padding: 10px 14px; border-radius: 16px; background: #fff8e1; border: 1px solid #f2cf73; box-shadow: var(--shadow); font-size: .85rem;
  max-width: calc(100% - 96px);
}

/* ---------- 실시간 퀴즈 ---------- */
:root { --q0: #e5577a; --q1: #4a7fd6; --q2: #dfa21f; --q3: #36a37a; }
.qz-wrap { display: grid; grid-template-columns: 1fr 280px; gap: 20px; align-items: start; max-width: 960px; margin: 0 auto; }
.qz-play, .qz-hostcard { transform: none !important; }
.qz-hostcard h3 { margin: 0 0 4px; }
.qz-play { min-height: 360px; display: flex; flex-direction: column; }
.qz-join { max-width: 380px; width: 100%; margin: 0 auto; text-align: center; }
.qz-join form { display: grid; gap: 12px; text-align: left; margin-top: 12px; }
.qz-logo {
  width: 64px; height: 64px; margin: 0 auto; border-radius: 20px; display: grid; place-items: center;
  font-size: 2rem; font-weight: 700; color: #fff; background: linear-gradient(135deg, var(--pink-400), var(--purple-600));
}
.qz-join h3 { margin: 10px 0 0; }
#qzPin { font-size: 1.4rem; letter-spacing: .3em; text-align: center; font-weight: 700; }
.qz-p-head { display: flex; align-items: center; gap: 10px; padding-bottom: 12px; border-bottom: 1px dashed var(--pink-200); margin-bottom: 16px; }
.qz-me { font-weight: 500; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.qz-score { font-weight: 700; color: var(--purple-600); }
.qz-wait, .qz-ready, .qz-result, .qz-final { flex: 1; display: grid; place-content: center; justify-items: center; text-align: center; gap: 6px; padding: 10px 0; }
.qz-wait h3, .qz-ready h3, .qz-result h3, .qz-final h3 { margin: 6px 0 0; font-size: 1.3rem; word-break: keep-all; }
.qz-wait p, .qz-ready p, .qz-result p, .qz-final p { margin: 0; }
.qz-spinner { width: 44px; height: 44px; border-radius: 50%; border: 4px solid var(--pink-100); border-top-color: var(--purple-600); animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.qz-timer { font-weight: 700; font-variant-numeric: tabular-nums; }
.qz-timer.big { font-size: 3.4rem; color: var(--purple-600); line-height: 1; }
.qz-p-top { display: flex; justify-content: space-between; align-items: center; color: var(--text-soft); font-size: .9rem; }
.qz-p-top .qz-timer { min-width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: #fff; background: var(--purple-600); }
.qz-p-question { margin: 10px 0 16px; font-size: 1.15rem; line-height: 1.5; word-break: keep-all; }
.qz-p-choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.qz-choice {
  min-height: 92px; border: none; border-radius: 18px; padding: 12px; cursor: pointer; color: #fff;
  font: inherit; font-weight: 700; font-size: 1rem; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
  box-shadow: 0 5px 0 rgba(0,0,0,.18); transition: transform .1s, box-shadow .1s, opacity .2s; word-break: keep-all;
}
.qz-choice:active { transform: translateY(4px); box-shadow: 0 1px 0 rgba(0,0,0,.18); }
